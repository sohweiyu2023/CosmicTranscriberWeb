name: Capture Worker/package source 1.0.12

on:
  push:
    branches: ['diag/runtime-source-only-1.0.12']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Materialize exact reviewed source snapshot
        run: python .ci/materialize.py
      - name: Apply exact current certification repairs
        run: |
          python .ci/repair_integration.py
          python .ci/repair_e2e.py
          python .ci/repair_install_policy.py
      - name: Print exact suspected sources with line numbers
        working-directory: work
        run: |
          for file in tests/worker/runtime.test.js vitest.config.js tests/worker/wrangler.test.jsonc scripts/package-source.mjs scripts/verify-source-package.mjs scripts/release-verify.mjs scripts/npm-invoke.mjs scripts/zip-utils.mjs RELEASE-WINDOWS.ps1 WINDOWS-TOOLCHAIN.ps1 package.json .npmrc; do
            echo
            echo "===== $file ====="
            nl -ba "$file"
          done
      - name: Upload exact source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-source-evidence
          path: |
            work/tests/worker/runtime.test.js
            work/vitest.config.js
            work/tests/worker/wrangler.test.jsonc
            work/scripts/package-source.mjs
            work/scripts/verify-source-package.mjs
            work/scripts/release-verify.mjs
            work/scripts/npm-invoke.mjs
            work/scripts/zip-utils.mjs
            work/RELEASE-WINDOWS.ps1
            work/WINDOWS-TOOLCHAIN.ps1
            work/package.json
            work/.npmrc
          if-no-files-found: error
          retention-days: 3
