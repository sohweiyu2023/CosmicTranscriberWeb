name: Cosmic PR57 Windows FFmpeg 9.1 offline proof

on:
  push:
    branches: ['review/pr57-windows-ffmpeg-910-proof-20261123']
    paths: ['.github/workflows/pr57-windows-ffmpeg-proof.yml']

permissions:
  contents: read

jobs:
  resolve-lock:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/review/pr57-windows-ffmpeg-910-proof-20261123' }}
    name: Resolve one reviewed dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      reviewed_inputs_sha256: ${{ steps.reviewed-input-bundle.outputs.reviewed_inputs_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 94d87e6239ed0cddfdfc40e3443625c1f4b80513
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "94d87e6239ed0cddfdfc40e3443625c1f4b80513" && test -z "$(git status --porcelain)"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26.7.0'
          package-manager-cache: false
      - name: Activate reviewed npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Verify tool versions
        run: |
          node --version
          test "$(node --version)" = "v26.7.0"
          test "$(npm --version)" = "12.0.2"
      - name: Verify the committed dependency snapshot before installation
        run: node "${{ github.workspace }}/scripts/verify-reviewed-dependency-graph.mjs" --ci
      - name: Install the exact committed graph without lifecycle execution
        run: npm ci --ignore-scripts
      - name: Verify package metadata and lock remain unchanged
        run: node "${{ github.workspace }}/scripts/verify-reviewed-dependency-graph.mjs" --ci
      - name: Verify reviewed install-script policy
        run: npm run deps:install-scripts:verify
      - name: Verify complete installed dependency tree
        run: npm ls --all
      - name: Audit resolved graph
        run: npm audit
      - name: Require direct dependencies to be current
        run: npm outdated --depth=0
      - name: Provision audio fixture toolchain
        timeout-minutes: 10
        run: node scripts/provision-ci-media.mjs
      - name: Generate deterministic MP3 and nine-format fixtures
        run: node scripts/generate-test-fixtures.mjs
      - name: Full dependency-free adversarial gate
        run: npm run validate
      - name: Verify committed inputs after validation
        run: node "${{ github.workspace }}/scripts/verify-reviewed-dependency-graph.mjs" --ci
      - name: Verify exact approved single MP3 bytes (no provider calls)
        run: node --input-type=module -e "import {readFile} from 'node:fs/promises'; import {verifyFixedMp3} from './scripts/staging-single-mp3-smoke.mjs'; verifyFixedMp3(await readFile('tests/fixtures/approved-single-mp3/staging-speech.mp3'));"
      - name: Validate exactly the eight approved synthetic speech fixtures (no provider calls)
        run: node scripts/prepare-remaining-eight-fixtures.mjs tests/fixtures/approved-remaining-eight "$RUNNER_TEMP/approved-eight"
      - name: Bind exact reviewed inputs and fixture bytes
        id: reviewed-input-bundle
        run: node "${{ github.workspace }}/scripts/verify-reviewed-dependency-graph.mjs" --ci --prepare-input-bundle
      - name: Upload reviewed lock and fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-release-inputs
          path: ${{ runner.temp }}/cosmic-reviewed-inputs.zip
          if-no-files-found: error
          retention-days: 7
  windows-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/review/pr57-windows-ffmpeg-910-proof-20261123' }}
    name: Windows toolchain + Chrome/Edge + staging-certified ZIP
    needs: resolve-lock
    runs-on: windows-latest
    outputs:
      version: ${{ steps.certified.outputs.version }}
      artifact-name: ${{ steps.certified.outputs.artifact-name }}
      source-file: ${{ steps.certified.outputs.source-file }}
      source-sha256: ${{ steps.certified.outputs.source-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 94d87e6239ed0cddfdfc40e3443625c1f4b80513
          persist-credentials: false
      - name: Verify immutable source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "94d87e6239ed0cddfdfc40e3443625c1f4b80513" && test -z "$(git status --porcelain)"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26.7.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reviewed-release-inputs
          path: ${{ runner.temp }}/cosmic-reviewed-inputs-download
      - name: Verify isolated reviewed input bundle before restoring fixture data
        env:
          REVIEWED_INPUTS_SHA256: ${{ needs.resolve-lock.outputs.reviewed_inputs_sha256 }}
        run: node "${{ github.workspace }}/scripts/verify-reviewed-dependency-graph.mjs" --ci --restore-input-bundle
      - name: Activate reviewed npm for shared-lock preflight
        shell: pwsh
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Verify the shared exact dependency snapshot before lifecycle execution
        run: node "${{ github.workspace }}/scripts/verify-reviewed-dependency-graph.mjs" --ci
      - run: npm run deps:install-scripts:verify
      - run: npm ci
      - name: Verify installation preserved the reviewed graph
        run: node "${{ github.workspace }}/scripts/verify-reviewed-dependency-graph.mjs" --ci
      - run: npm ls --all
      - run: npm run deps:install-scripts:verify
      - run: npm audit
      - name: Execute private Windows toolchain regression/smoke test
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\WINDOWS-TOOLCHAIN-SELFTEST.ps1
      - name: Provision hash-bound Windows FFmpeg pair
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $reviewedBody = @'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packageHash = '485a1b7ca4c35e0bf2a87971ed4ba21681de90db035aee4e6ee822abc05cad05'
          $payloadHash = '835b9a733445ba7a56a37a26cf7bde84e2f3ce7da2a8ec984276bb2abb1b922c'
          $versionPattern = '^(ffmpeg|ffprobe) version 9[.]1(?:[.]0)?-essentials_build(?:-| )'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw 'Reviewed runner 7-Zip missing.' }
          if ((Get-Item -LiteralPath $sevenZip).VersionInfo.FileVersion -notmatch '^26[.]06(?:[.]0)*(?:$|\s)') {
            throw 'Reviewed runner 7-Zip 26.06 not found.'
          }
          $root = Join-Path $env:RUNNER_TEMP ('cosmic-ffmpeg-' + [Guid]::NewGuid().ToString('N'))
          $null = New-Item -Path $root -ItemType Directory
          $package = Join-Path $root 'ffmpeg.9.1.0.nupkg'
          $payload = Join-Path $root 'ffmpeg-release-essentials.7z'
          $url = 'https://community.chocolatey.org/api/v2/package/ffmpeg/9.1.0'
          Invoke-WebRequest -Uri $url -OutFile $package -TimeoutSec 90 -MaximumRedirection 4
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ine $packageHash) {
            throw 'FFmpeg Chocolatey package SHA-256 mismatch; no extraction or execution.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entry = @($zip.Entries | Where-Object FullName -CEQ 'tools/ffmpeg-release-essentials.7z')
            if ($entry.Count -ne 1) { throw 'Expected exactly one embedded FFmpeg archive.' }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry[0], $payload, $false)
          } finally { $zip.Dispose() }
          if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash -ine $payloadHash) {
            throw 'Embedded FFmpeg payload SHA-256 mismatch; no extraction or execution.'
          }
          $extractTo = Join-Path $root 'extracted'
          & $sevenZip x $payload "-o$extractTo" -y
          if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg archive extraction failed.' }
          $bin = Join-Path $extractTo 'ffmpeg-9.1-essentials_build\bin'
          foreach ($name in @('ffmpeg','ffprobe')) {
            $exe = Join-Path $bin ($name + '.exe')
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Pinned $name missing." }
            $reported = @(& $exe -version)
            if ($LASTEXITCODE -ne 0 -or $reported.Count -lt 1 -or $reported[0] -cnotmatch $versionPattern -or -not $reported[0].StartsWith("$name ")) {
              throw "Pinned $name version assertion failed."
            }
            Write-Output $reported[0]
            Write-Output ("$name SHA256: " + (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant())
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin -Encoding utf8
          '@
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($reviewedBody, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            throw ('Reviewed Windows media body did not parse: ' + (($errors | ForEach-Object { $_.Message }) -join '; '))
          }
          Write-Output 'Reviewed Windows media body PowerShell AST parsed successfully.'
          & ($ast.GetScriptBlock())
      - name: Assert subsequent steps resolve to the pinned FFmpeg pair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reviewedBody = @'
          $ErrorActionPreference = 'Stop'
          $pair = @(foreach ($name in @('ffmpeg','ffprobe')) { (Get-Command $name -CommandType Application).Source })
          $tmp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $prefix = "$tmp\cosmic-ffmpeg-"
          if ($pair.Count -ne 2 -or (Split-Path $pair[0]) -cne (Split-Path $pair[1])) { throw 'Expected one pinned FFmpeg bin directory.' }
          foreach ($p in $pair) {
            if (-not $p.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) { throw 'Windows PATH did not select the pinned FFmpeg tools.' }
          }
          '@
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($reviewedBody, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            throw ('Reviewed Windows media body did not parse: ' + (($errors | ForEach-Object { $_.Message }) -join '; '))
          }
          Write-Output 'Reviewed Windows media body PowerShell AST parsed successfully.'
          & ($ast.GetScriptBlock())
      - run: npm run validate
      - run: npm run build
      - run: npm run browsers:install:branded
      - run: npm run test:e2e:branded
      - run: npm run build:inspect
      - name: Inspect Windows runner socket exhaustion without altering networking
        if: ${{ always() }}
        shell: pwsh
        run: |
          Write-Output 'Windows TCP ephemeral port ranges:'
          & netsh int ipv4 show dynamicport tcp
          & netsh int ipv6 show dynamicport tcp
          Write-Output 'Socket counts by TCP state:'
          try {
            Get-NetTCPConnection -ErrorAction Stop |
              Group-Object State |
              Sort-Object Name |
              Select-Object Name,Count |
              Format-Table -AutoSize
          } catch { Write-Warning ('TCP diagnostic unavailable: ' + $_.Exception.Message) }
          Write-Output 'Branded browser process counts:'
          try {
            Get-Process -Name chrome,msedge,firefox -ErrorAction SilentlyContinue |
              Group-Object ProcessName |
              Select-Object Name,Count |
              Format-Table -AutoSize
          } catch { Write-Warning ('Browser process diagnostic unavailable: ' + $_.Exception.Message) }
      - name: Record reviewed lock hash
        id: lock-before
        shell: pwsh
        run: "Write-Output ('hash=' + (Get-FileHash .\\package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()) >> $env:GITHUB_OUTPUT"
      - name: Run complete Windows certification for staging candidate
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\RELEASE-WINDOWS.ps1
      - name: Prove certification did not alter the reviewed dependency graph
        shell: pwsh
        env:
          LOCK_BEFORE: ${{ steps.lock-before.outputs.hash }}
        run: |
          $after=(Get-FileHash .\package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($after -ne $env:LOCK_BEFORE) { throw "Release certification changed package-lock.json: before=$env:LOCK_BEFORE after=$after" }
      - name: Verify versioned staging-certified ZIP
        id: certified
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content -LiteralPath .\package.json -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid release package version.' }
          $rootName = "CosmicTranscriberWeb-$version"
          $sourceFile = "$rootName-source.zip"
          $zip = Resolve-Path -LiteralPath (Join-Path .. $sourceFile)
          if (-not (Test-Path -LiteralPath $zip.Path -PathType Leaf)) { throw 'Staging-certified ZIP missing.' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.Path)
          try {
            $entry = $archive.GetEntry("$rootName/RELEASE_MANIFEST.json")
            if ($null -eq $entry) { throw 'Staging-certified manifest missing from versioned ZIP root.' }
            $reader = [System.IO.StreamReader]::new($entry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json }
            finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          if ($manifest.version -cne $version -or $manifest.releaseReady -isnot [bool] -or $manifest.releaseReady -ne $false -or $manifest.certificationLevel -cne 'staging') {
            throw 'CI may publish only a matching staging candidate with releaseReady:false.'
          }
          $lockHash = (Get-FileHash -LiteralPath .\package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.dependencyLock.status -ne 'verified' -or $manifest.dependencyLock.sha256 -ne $lockHash) {
            throw 'Staging candidate does not contain the reviewed dependency graph.'
          }
          $sourceHash = (Get-FileHash -LiteralPath $zip.Path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('path=' + $zip.Path) >> $env:GITHUB_OUTPUT
          Write-Output ('version=' + $version) >> $env:GITHUB_OUTPUT
          Write-Output ('artifact-name=' + $rootName + '-staging-certified') >> $env:GITHUB_OUTPUT
          Write-Output ('source-file=' + $sourceFile) >> $env:GITHUB_OUTPUT
          Write-Output ('source-sha256=' + $sourceHash) >> $env:GITHUB_OUTPUT
      - name: Verify committed inputs before certified artifact publication
        run: node "${{ github.workspace }}/scripts/verify-reviewed-dependency-graph.mjs" --ci
