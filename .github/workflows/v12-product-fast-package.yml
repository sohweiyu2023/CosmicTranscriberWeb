name: V1.2 Product Fast Package

on:
  push:
    branches:
      - dev/v1.2.0-product-fast
    paths:
      - '.github/workflows/v12-product-fast-package.yml'
      - 'product/v12-deps-incremental-20260827.patch.gz.b64'
  pull_request:
    branches:
      - dev/v1.2.0-validation-base
    paths:
      - '.github/workflows/v12-product-fast-package.yml'
      - 'product/v12-deps-incremental-20260827.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_ARTIFACT_ID: '9499663656'
  BASE_ARTIFACT_SHA256: e44ec5237145d0f6c90f1123dcbec7105eed9ec13bdaa3e890e9886f6de8efc4
  BASE_LOCK_SHA256: 145c28bdf9cb6178a6e1ccf687e686a1bd42f77c1b5ad49617bc23bcb631a76e
  DELTA_B64_SHA256: fdccb3ccabaabab3633930a34b994e2f0e7d9d9cf30e9f0e8bda16941a121e87
  DELTA_GZIP_SHA256: e8a6a659b93705549018773816d5296ebce79c1f63b703c3da2ebb0e0a31a60b
  DELTA_PATCH_SHA256: fd2ad8b2be685d46ac4814e171daba7ace645917a310a8c9e06ea9aab08c3d25
  V12_LOCK_SHA256: 90c85c65637a2e243273a13438cb23a9a51c3d1aea80236ecf4983df4876b85d

jobs:
  windows-release-package:
    name: Windows complete release + fresh ZIP round-trip
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 26.7.0}
      - name: Install exact npm
        shell: pwsh
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Materialize exact refreshed V1.2 candidate
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((node --version).Trim()-ne 'v26.7.0'){throw 'Node version mismatch'}; if((npm --version).Trim()-ne '12.0.2'){throw 'npm version mismatch'}
          $root=Join-Path $env:RUNNER_TEMP 'v12-release'; New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base=Join-Path $root 'base.zip'; $p=Start-Process gh -ArgumentList @('api',"/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:BASE_ARTIFACT_ID/zip") -RedirectStandardOutput $base -NoNewWindow -Wait -PassThru; if($p.ExitCode-ne 0){throw 'artifact download failed'}
          if((Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant()-ne $env:BASE_ARTIFACT_SHA256){throw 'base artifact hash mismatch'}
          $wrap=Join-Path $root 'wrapper'; Expand-Archive $base $wrap -Force; $inner=Join-Path $wrap 'CosmicTranscriberWeb-1.2.0-source.zip'; if(-not(Test-Path $inner)){throw 'base source ZIP missing'}
          $source=Join-Path $root 'source'; Expand-Archive $inner $source -Force; $candidate=Join-Path $source 'CosmicTranscriberWeb-1.2.0'; Set-Location $candidate
          if((node -p "require('./package.json').version").Trim()-ne '1.2.0'){throw 'version mismatch'}; if((node -p "require('./RELEASE_MANIFEST.json').releaseReady").Trim()-ne 'false'){throw 'base releaseReady mismatch'}; if((node -p "require('./RELEASE_MANIFEST.json').certificationLevel").Trim()-ne 'staging'){throw 'base certification mismatch'}
          if((Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()-ne $env:BASE_LOCK_SHA256){throw 'base lock mismatch'}
          $delta=(Resolve-Path "$env:GITHUB_WORKSPACE/product/v12-deps-incremental-20260827.patch.gz.b64").Path; if((Get-FileHash $delta -Algorithm SHA256).Hash.ToLowerInvariant()-ne $env:DELTA_B64_SHA256){throw 'delta b64 mismatch'}
          $gz=Join-Path $root 'delta.gz'; [IO.File]::WriteAllBytes($gz,[Convert]::FromBase64String([IO.File]::ReadAllText($delta).Trim())); if((Get-FileHash $gz -Algorithm SHA256).Hash.ToLowerInvariant()-ne $env:DELTA_GZIP_SHA256){throw 'delta gzip mismatch'}
          $patch=Join-Path $root 'delta.patch'; $i=[IO.File]::OpenRead($gz); try{$g=[IO.Compression.GZipStream]::new($i,[IO.Compression.CompressionMode]::Decompress);try{$o=[IO.File]::Create($patch);try{$g.CopyTo($o)}finally{$o.Dispose()}}finally{$g.Dispose()}}finally{$i.Dispose()}; if((Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()-ne $env:DELTA_PATCH_SHA256){throw 'delta patch mismatch'}
          git init -q; git config core.autocrlf false; git config core.eol lf; git apply --check $patch; if($LASTEXITCODE-ne 0){throw 'delta check failed'}; git apply $patch; if($LASTEXITCODE-ne 0){throw 'delta apply failed'}
          if((Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()-ne $env:V12_LOCK_SHA256){throw 'refreshed lock mismatch'}
          "CANDIDATE=$candidate" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append; "SOURCE_PARENT=$source" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Provision release prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location $env:CANDIDATE
          npm ci; if($LASTEXITCODE-ne 0){throw 'npm ci failed'}; npm run deps:install-scripts:verify; if($LASTEXITCODE-ne 0){throw 'install-script policy failed'}; npm audit; if($LASTEXITCODE-ne 0){throw 'audit failed'}; npm outdated --depth=0; if($LASTEXITCODE-ne 0){throw 'direct dependency drift remains'}
          if(-not(Get-Command ffmpeg -ErrorAction SilentlyContinue)-or -not(Get-Command ffprobe -ErrorAction SilentlyContinue)){choco install ffmpeg -y --no-progress; if($LASTEXITCODE-ne 0){throw 'ffmpeg install failed'}}
          node scripts/generate-test-fixtures.mjs; if($LASTEXITCODE-ne 0){throw 'fixture generation failed'}
      - name: Run complete Windows staging certification and fresh ZIP revalidation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; Set-Location $env:CANDIDATE
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\RELEASE-WINDOWS.ps1; if($LASTEXITCODE-ne 0){throw 'RELEASE-WINDOWS.ps1 failed'}
          if((node -p "require('./RELEASE_MANIFEST.json').releaseReady").Trim()-ne 'false'){throw 'editable candidate releaseReady mutated'}
          if((Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()-ne $env:V12_LOCK_SHA256){throw 'release changed reviewed lock'}
          $zip=Join-Path $env:SOURCE_PARENT 'CosmicTranscriberWeb-1.2.0-source.zip'; if(-not(Test-Path $zip)){throw 'staging ZIP missing'}
          $extract=Join-Path $env:RUNNER_TEMP 'fresh-extract'; Expand-Archive $zip $extract -Force; $fresh=Join-Path $extract 'CosmicTranscriberWeb-1.2.0'; if(-not(Test-Path (Join-Path $fresh 'package.json'))){throw 'fresh ZIP structure invalid'}
          Set-Location $fresh; if((Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash.ToLowerInvariant()-ne $env:V12_LOCK_SHA256){throw 'fresh ZIP lock mismatch'}; if((node -p "require('./RELEASE_MANIFEST.json').releaseReady").Trim()-ne 'false'){throw 'fresh ZIP releaseReady mismatch'}; npm ci; if($LASTEXITCODE-ne 0){throw 'fresh ZIP npm ci failed'}; npm run deps:install-scripts:verify; if($LASTEXITCODE-ne 0){throw 'fresh ZIP policy failed'}; npm audit; if($LASTEXITCODE-ne 0){throw 'fresh ZIP audit failed'}; npm outdated --depth=0; if($LASTEXITCODE-ne 0){throw 'fresh ZIP dependency drift'}
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant(); "V12_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append; "V12_ZIP_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append; Write-Host "V1.2 refreshed staging-candidate ZIP SHA-256: $hash"
      - name: Upload refreshed staging candidate - NOT FINAL
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: CosmicTranscriberWeb-1.2.0-refreshed-staging-candidate-NOT-FINAL
          path: ${{ env.V12_ZIP }}
          if-no-files-found: error
          retention-days: 7
      - name: Reassert production block
        shell: pwsh
        run: Write-Host 'Refreshed staging candidate remains releaseReady:false; production stays blocked until live staging acceptance and final certification.'
