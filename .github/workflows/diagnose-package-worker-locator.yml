name: Source-package Worker diagnostic run locator

on:
  push:
    branches: ['diag/package-worker-1.0.12']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact package diagnostic run URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 24); do
            response="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API_URL}/repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=30")"
            run_id="$(printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); runs=[r for r in data.get("workflow_runs",[]) if r.get("name")=="Diagnose source-package Worker verification 1.0.12"]; print(runs[0]["id"] if runs else "")')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo 'Could not locate source-package Worker diagnostic for this exact head.' >&2
            exit 1
          fi
          target_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${run_id}"
          payload="$(TARGET_URL="$target_url" python -c 'import json,os; print(json.dumps({"state":"pending","context":"cosmic-package-worker-diagnostic-run","description":"Exact source-package Worker diagnostic run","target_url":os.environ["TARGET_URL"]}))')"
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_URL}/repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -d "$payload" >/dev/null
          echo "Diagnostic run: ${target_url}"
