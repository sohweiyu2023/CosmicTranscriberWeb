name: Diagnose protected staging Access ONLY
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    if: ${{ github.repository == 'sohweiyu2023/CosmicTranscriberWeb' && github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_CF_AUTHORIZATION: ${{ secrets.STAGING_CF_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.7.0'
          package-manager-cache: false
      - name: One protected app-shell GET; fixed redacted categories only
        run: |
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          import {diagnoseProtectedStaging} from './scripts/staging-deploy-only.mjs';
          const result=await diagnoseProtectedStaging(process.env.STAGING_CF_AUTHORIZATION);
          await writeFile('staging-access-diagnostic.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result));
          process.exitCode=result.status==='PASS'?0:1;
          NODE
      - name: Preserve redacted diagnostic only
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-access-diagnostic
          path: staging-access-diagnostic.json
          if-no-files-found: error
          retention-days: 7
