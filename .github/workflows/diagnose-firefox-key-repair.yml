name: Diagnose Windows Firefox key repair 1.0.12

on:
  push:
    branches: ['diag/windows-release-1.0.12']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  windows-firefox-key-repair:
    name: Windows Firefox key repair + inner release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Materialize exact reviewed source snapshot
        shell: pwsh
        run: python .ci/materialize.py
      - name: Repair and verify integration harness
        shell: pwsh
        run: python .ci/repair_integration.py
      - name: Repair Playwright E2E endpoint inheritance
        shell: pwsh
        run: python .ci/repair_e2e.py
      - name: Apply existing certification repairs
        shell: pwsh
        run: python .ci/repair_install_policy.py
      - name: Apply Windows Firefox secure-key repair
        shell: pwsh
        run: python .ci/repair_firefox_key_dialog.py
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Restore exact reviewed lock and fixtures from failed certification run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-inputs
          path: reviewed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31450081424
      - name: Restore reviewed dependency graph and fixtures
        shell: pwsh
        run: |
          Copy-Item reviewed\package-lock.json work\package-lock.json -Force
          New-Item -ItemType Directory -Path work\tests\fixtures -Force | Out-Null
          Copy-Item reviewed\tests\fixtures\*.mp3 work\tests\fixtures\ -Force
      - name: Activate reviewed npm
        shell: pwsh
        working-directory: work
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Verify exact Node/npm
        shell: pwsh
        working-directory: work
        run: |
          if ((node --version).Trim() -ne 'v24.19.0') { throw "Expected Node v24.19.0; got $(node --version)" }
          if ((npm --version).Trim() -ne '12.0.2') { throw "Expected npm 12.0.2; got $(npm --version)" }
      - name: Install exact reviewed dependencies
        working-directory: work
        run: npm ci
      - name: Verify lifecycle-script policy
        working-directory: work
        run: npm run deps:install-scripts:verify
      - name: Dependency audit
        working-directory: work
        run: npm audit
      - name: Provision media validation toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) { throw 'ffmpeg/ffprobe provisioning failed.' }
          & $ffmpeg.Source -version | Select-Object -First 1
          & $ffprobe.Source -version | Select-Object -First 1
      - name: Full adversarial validation including new safeguards and mutations
        working-directory: work
        run: npm run validate
      - name: Install Firefox
        working-directory: work
        run: node scripts/playwright-invoke.mjs install firefox
      - name: Stress repaired secure-key pointer click in Windows Firefox
        working-directory: work
        run: |
          npm run build
          node scripts/playwright-invoke.mjs test --project=firefox --grep "secure key setup, native controls, queue, mocked transcript and downloads" --repeat-each=10 --workers=1
      - name: Run complete Windows release certification with durable capture
        id: inner_release
        continue-on-error: true
        shell: pwsh
        working-directory: work
        run: |
          $output = Join-Path $PWD 'windows-firefox-repair-release-output.log'
          $transcript = Join-Path $PWD 'windows-firefox-repair-release-transcript.log'
          $exitFile = Join-Path $PWD 'windows-firefox-repair-release-exit-code.txt'
          Remove-Item $output,$transcript,$exitFile -Force -ErrorAction SilentlyContinue
          $code = 1
          Start-Transcript -Path $transcript -Force
          try {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\RELEASE-WINDOWS.ps1 2>&1 | Tee-Object -FilePath $output
            $code = $LASTEXITCODE
          }
          catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath $output -Append | Write-Host
            $code = 1
          }
          finally {
            try { Stop-Transcript | Out-Null } catch {}
          }
          Set-Content -Path $exitFile -Value $code -Encoding utf8
          Write-Host "Inner RELEASE-WINDOWS.ps1 exit code: $code"
          if ($code -ne 0) { exit $code }
      - name: Upload repaired Windows diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-firefox-key-repair-diagnostic
          path: |
            work/windows-firefox-repair-release-output.log
            work/windows-firefox-repair-release-transcript.log
            work/windows-firefox-repair-release-exit-code.txt
            work/test-results
            work/playwright-report
            work/blob-report
            work/*.zip
            work/RELEASE-WINDOWS.ps1
            work/package.json
            work/package-lock.json
            work/public/index.html
            work/public/js/app.js
            work/tests/e2e/app.spec.js
            work/scripts/audit-lib.mjs
            work/scripts/mutation-suite.mjs
          if-no-files-found: warn
          retention-days: 3
      - name: Require repaired inner release success
        if: always()
        shell: pwsh
        working-directory: work
        run: |
          $exitFile = '.\windows-firefox-repair-release-exit-code.txt'
          if (-not (Test-Path $exitFile)) { throw 'Inner release exit-code evidence is missing.' }
          $code = (Get-Content $exitFile -Raw).Trim()
          if ($code -ne '0') { throw "Inner release runner failed with exit code $code; diagnostics uploaded." }

      - name: Publish diagnostic run URL
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $target = "$env:SERVER_URL/$env:REPOSITORY/actions/runs/$env:RUN_ID"
          $body = @{ state='pending'; context='cosmic-firefox-key-diagnostic-run'; description='Windows Firefox secure-key repair diagnostic'; target_url=$target } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "$env:API_URL/repos/$env:REPOSITORY/statuses/$env:HEAD_SHA" -Headers @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
          Write-Host "Diagnostic run: $target"
