name: V1.2 Inspect MPGA Provider Patch Origin

on:
  push:
    branches: [dev/v1.2.0-product-fast]
    paths: ['.github/workflows/v12-inspect-format-overlay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inspect exact hash-checked V1.2 overlay provider changes
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v12-batch2-prebilling-overlay.b64/part-* | base64 -d > "$RUNNER_TEMP/batch2.tar.gz"
          printf '%s  %s\n' 32c3f00a7cc5268f9f82b1e6b259347ece54e5a3273b56555974363f2e4ce05c "$RUNNER_TEMP/batch2.tar.gz" | sha256sum -c -
          echo 'BATCH2_FILES:'
          tar -tzf "$RUNNER_TEMP/batch2.tar.gz" | grep -E '(openai|audio-formats|index|validation)' || true
          if tar -tzf "$RUNNER_TEMP/batch2.tar.gz" | grep -Eq '(^|/)src/openai.js$'; then
            echo 'BATCH2_PROVIDER:'
            tar -xOf "$RUNNER_TEMP/batch2.tar.gz" src/openai.js | sed -n '1,130p'
          fi
          base64 -d tools/v12-batch3-multiformat.patch.gz.b64 | gzip -dc > "$RUNNER_TEMP/batch3.patch"
          printf '%s  %s\n' abdb0e1040bef4ef7e87f615b14d90840c3c2fdfa68c296170346742617352dd "$RUNNER_TEMP/batch3.patch" | sha256sum -c -
          echo 'BATCH3_PROVIDER_PATCH_CONTEXT:'
          awk '/^diff --git a\/src\/openai.js /{p=1} /^diff --git / && !/^diff --git a\/src\/openai.js / && p{exit} p {print}' "$RUNNER_TEMP/batch3.patch" | head -180
          echo 'BATCH1_RECONSTRUCTION_SCRIPT_PROVIDER_REFERENCES:'
          node - <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('.github/workflows/reconstruct-v12-dev-source.yml','utf8');
          const lines=source.split(String.fromCharCode(10));
          const opener=lines.findIndex(line=>line.includes("<<'V12_RECONSTRUCTION_B64'"));
          const closer=lines.findIndex((line,i)=>i>opener&&line.trim()==='V12_RECONSTRUCTION_B64');
          if(opener<0||closer<0||closer<=opener)throw Error('missing Batch1 payload delimiters');
          const payload=lines.slice(opener+1,closer).map(line=>line.trim()).join('');
          fs.writeFileSync('/tmp/v12-batch1-reconstruction.gz',Buffer.from(payload,'base64'));
          NODE
          gzip -dc /tmp/v12-batch1-reconstruction.gz > /tmp/v12-batch1-reconstruction.mjs
          grep -n -C 6 -E '(openai\\.js|filename=|audio\\.mpga|audioFormat|Content-Disposition)' /tmp/v12-batch1-reconstruction.mjs | head -160 || true
          echo 'No release artifact generated, no production or staging deployment.'
