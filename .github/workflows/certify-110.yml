name: Cosmic Transcriber Web 1.1.0 Certification

on:
  push:
    branches: ['ci/1.1.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-lock:
    name: Resolve latest direct dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify immutable first-party Action refs
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,re,sys
          text=pathlib.Path('.github/workflows/certify-110.yml').read_text(encoding='utf-8')
          refs=re.findall(r'^\s*-?\s*uses:\s*([^\s#]+)',text,flags=re.M)
          bad=[r for r in refs if not re.fullmatch(r'actions/[A-Za-z0-9_.-]+@[0-9a-f]{40}',r)]
          if bad:
              print('Non-immutable first-party action refs:',*bad,sep='\n  - ');sys.exit(1)
          print(f'Action SHA-pin gate PASS ({len(refs)} refs).')
          PY
      - name: Materialize reviewed 1.1.0 candidate
        run: python .ci/build_110_candidate.py
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - name: Activate reviewed npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Verify exact Node/npm candidate toolchain
        run: |
          test "$(node --version)" = "v26.5.1"
          test "$(npm --version)" = "12.0.2"
      - name: Refresh every direct dependency to registry latest
        working-directory: work
        run: node scripts/deps-latest.mjs
      - name: Verify resolved lifecycle-script policy before execution
        working-directory: work
        run: npm run deps:install-scripts:verify
      - name: Execute only reviewed dependency lifecycle scripts
        working-directory: work
        run: npm rebuild
      - name: Require zero known npm vulnerabilities
        working-directory: work
        run: npm audit
      - name: Prove every direct dependency is current
        working-directory: work
        run: npm outdated --depth=0
      - name: Provision deterministic MP3 fixture toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Generate deterministic MP3 fixtures
        working-directory: work
        run: node scripts/generate-test-fixtures.mjs
      - name: Full dependency-free adversarial gate
        working-directory: work
        run: npm run validate
      - name: Upload exact reviewed package graph and fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-release-inputs-1.1.0
          path: |
            work/package.json
            work/package-lock.json
            work/tests/fixtures/*.mp3
          if-no-files-found: error
          retention-days: 7

  linux-full:
    name: Linux Worker + integration + core browsers
    needs: resolve-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python .ci/build_110_candidate.py
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-inputs-1.1.0
          path: reviewed
      - name: Restore exact reviewed graph and fixtures
        run: |
          cp reviewed/package.json work/package.json
          cp reviewed/package-lock.json work/package-lock.json
          mkdir -p work/tests/fixtures
          cp reviewed/tests/fixtures/*.mp3 work/tests/fixtures/
      - run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - working-directory: work
        run: npm ci
      - working-directory: work
        run: npm run deps:install-scripts:verify && npm audit && npm outdated --depth=0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - working-directory: work
        run: npm run validate
      - working-directory: work
        run: npm run test:worker
      - working-directory: work
        run: npm run test:integration
      - working-directory: work
        run: npm run browsers:install:ci
      - working-directory: work
        run: npm run test:e2e:core
      - working-directory: work
        run: npm run build:inspect

  macos-safari:
    name: macOS WebKit + real Safari
    needs: resolve-lock
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .ci/build_110_candidate.py
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-inputs-1.1.0
          path: reviewed
      - run: |
          cp reviewed/package.json work/package.json
          cp reviewed/package-lock.json work/package-lock.json
          mkdir -p work/tests/fixtures
          cp reviewed/tests/fixtures/*.mp3 work/tests/fixtures/
      - run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - working-directory: work
        run: npm ci
      - working-directory: work
        run: npm run deps:install-scripts:verify && npm audit && npm outdated --depth=0
      - name: Provision media validation toolchain
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then brew install ffmpeg; fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - working-directory: work
        run: npm run validate
      - working-directory: work
        run: npm run test:worker
      - working-directory: work
        run: npm run test:integration
      - working-directory: work
        run: npm run browsers:install:webkit
      - working-directory: work
        run: npm run test:e2e:webkit
      - name: Enable SafariDriver
        run: sudo /usr/bin/safaridriver --enable
      - working-directory: work
        run: npm run test:safari:real

  windows-release:
    name: Windows private toolchain + branded browsers + certified ZIP
    needs: resolve-lock
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: python .ci/build_110_candidate.py
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-inputs-1.1.0
          path: reviewed
      - shell: pwsh
        run: |
          Copy-Item reviewed\package.json work\package.json -Force
          Copy-Item reviewed\package-lock.json work\package-lock.json -Force
          New-Item -ItemType Directory -Path work\tests\fixtures -Force | Out-Null
          Copy-Item reviewed\tests\fixtures\*.mp3 work\tests\fixtures\ -Force
      - shell: pwsh
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Execute private Windows toolchain regression test
        shell: pwsh
        working-directory: work
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\WINDOWS-TOOLCHAIN-SELFTEST.ps1
      - working-directory: work
        run: npm ci
      - working-directory: work
        run: npm run deps:install-scripts:verify && npm audit && npm outdated --depth=0
      - name: Provision Windows media validation toolchain fail-closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $installed = $false
            for ($attempt = 1; $attempt -le 3 -and -not $installed; $attempt++) {
              Write-Host "Chocolatey FFmpeg install attempt $attempt/3..."
              choco install ffmpeg -y --no-progress
              $code = $LASTEXITCODE
              if ($code -eq 0 -and (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)) { $installed = $true; break }
              Write-Warning "FFmpeg provisioning attempt $attempt failed (exit=$code)."
              if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
            }
            if (-not $installed) { throw 'Failed to provision both ffmpeg and ffprobe after 3 attempts.' }
          }
          $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          $ffprobe = Get-Command ffprobe -ErrorAction Stop
          & $ffmpeg.Source -version | Select-Object -First 1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg executable self-check failed with exit code $LASTEXITCODE." }
          & $ffprobe.Source -version | Select-Object -First 1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "ffprobe executable self-check failed with exit code $LASTEXITCODE." }
      - working-directory: work
        run: npm run validate
      - working-directory: work
        run: npm run test:worker
      - working-directory: work
        run: npm run test:integration
      - working-directory: work
        run: npm run browsers:install:branded
      - working-directory: work
        run: npm run test:e2e:branded
      - working-directory: work
        run: npm run build:inspect
      - name: Record reviewed lock hash
        id: lock-before
        shell: pwsh
        working-directory: work
        run: "Write-Output ('hash=' + (Get-FileHash .\\package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()) >> $env:GITHUB_OUTPUT"
      - name: Run complete Windows release certification with durable capture
        id: inner-release
        continue-on-error: true
        shell: pwsh
        working-directory: work
        run: |
          $output=Join-Path $PWD 'windows-release-output.log'
          $transcript=Join-Path $PWD 'windows-release-transcript.log'
          $exitFile=Join-Path $PWD 'windows-release-exit-code.txt'
          Remove-Item $output,$transcript,$exitFile -Force -ErrorAction SilentlyContinue
          $code=1
          Start-Transcript -Path $transcript -Force
          try {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\RELEASE-WINDOWS.ps1 2>&1 | Tee-Object -FilePath $output
            $code=$LASTEXITCODE
          } catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath $output -Append | Write-Host
            $code=1
          } finally { try { Stop-Transcript | Out-Null } catch {} }
          Set-Content -Path $exitFile -Value $code -Encoding utf8
          if ($code -ne 0) { exit $code }
      - name: Upload complete Windows release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-complete-release-evidence-1.1.0
          path: |
            work/windows-release-output.log
            work/windows-release-transcript.log
            work/windows-release-exit-code.txt
            work/test-results
            work/playwright-report
            work/blob-report
            work/package.json
            work/package-lock.json
            CosmicTranscriberWeb-1.1.0-source.zip
          if-no-files-found: warn
          retention-days: 3
      - name: Require complete Windows release success
        shell: pwsh
        working-directory: work
        run: |
          $code=(Get-Content .\windows-release-exit-code.txt -Raw).Trim()
          if ($code -ne '0') { throw "Complete Windows release failed with exit code $code." }
      - name: Prove release did not mutate reviewed graph
        shell: pwsh
        working-directory: work
        env:
          LOCK_BEFORE: ${{ steps.lock-before.outputs.hash }}
        run: |
          $after=(Get-FileHash .\package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($after -ne $env:LOCK_BEFORE) { throw "Release certification changed package-lock.json: before=$env:LOCK_BEFORE after=$after" }
      - name: Locate certified release ZIP
        id: certified
        shell: pwsh
        working-directory: work
        run: |
          $zip=Resolve-Path ..\CosmicTranscriberWeb-1.1.0-source.zip
          if (-not (Test-Path $zip)) { throw 'Certified 1.1.0 release ZIP missing.' }
          Write-Output ('path=' + $zip.Path) >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CosmicTranscriberWeb-1.1.0-certified
          path: ${{ steps.certified.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  all-green:
    name: ALL RELEASE GATES GREEN
    needs: [linux-full, macos-safari, windows-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CosmicTranscriberWeb-1.1.0-certified
          path: certified
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-inputs-1.1.0
          path: reviewed
      - name: Independent final certified ZIP audit
        run: python .ci/audit_certified_zip.py certified/CosmicTranscriberWeb-1.1.0-source.zip reviewed/package-lock.json 1.1.0
      - name: Print final SHA-256
        run: |
          test -f certified/CosmicTranscriberWeb-1.1.0-source.zip
          sha256sum certified/CosmicTranscriberWeb-1.1.0-source.zip
          echo 'ALL RELEASE GATES GREEN'
