name: Diagnose Windows packaged Worker runtime 1.0.12

on:
  push:
    branches: ['diag/windows-runtime-config-1.0.12']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  windows-runtime-config:
    name: Windows packaged Worker runtime diagnostic
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Materialize exact reviewed source snapshot
        shell: pwsh
        run: python .ci/materialize.py

      - name: Apply exact current certification repairs
        shell: pwsh
        run: |
          python .ci/repair_integration.py
          python .ci/repair_e2e.py
          python .ci/repair_install_policy.py

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Restore exact reviewed lock and fixtures from current failed certification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-inputs
          path: reviewed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31472632201

      - name: Restore exact reviewed dependency graph and fixtures
        shell: pwsh
        run: |
          Copy-Item reviewed\package-lock.json work\package-lock.json -Force
          New-Item -ItemType Directory -Path work\tests\fixtures -Force | Out-Null
          Copy-Item reviewed\tests\fixtures\*.mp3 work\tests\fixtures\ -Force

      - name: Activate reviewed npm and verify exact runtime
        shell: pwsh
        working-directory: work
        run: |
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          if ((node --version).Trim() -ne 'v24.19.0') { throw "Expected Node v24.19.0; got $(node --version)" }
          if ((npm --version).Trim() -ne '12.0.2') { throw "Expected npm 12.0.2; got $(npm --version)" }

      - name: Execute Windows toolchain self-test
        shell: pwsh
        working-directory: work
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\WINDOWS-TOOLCHAIN-SELFTEST.ps1

      - name: Install exact reviewed dependencies
        working-directory: work
        run: npm ci

      - name: Verify lifecycle policy and dependency audit
        working-directory: work
        run: |
          npm run deps:install-scripts:verify
          npm audit

      - name: Provision media validation toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) { throw 'ffmpeg/ffprobe provisioning failed.' }
          & $ffmpeg.Source -version | Select-Object -First 1
          & $ffprobe.Source -version | Select-Object -First 1

      - name: Capture exact Worker test and dependency context before inner release
        shell: pwsh
        working-directory: work
        run: |
          $out = 'windows-runtime-pre-release-context.txt'
          Remove-Item $out -Force -ErrorAction SilentlyContinue
          "HEAD=$env:GITHUB_SHA" | Out-File $out -Encoding utf8
          "Node=$(node --version)" | Out-File $out -Append -Encoding utf8
          "npm=$(npm --version)" | Out-File $out -Append -Encoding utf8
          "`n=== package.json relevant entries ===" | Out-File $out -Append -Encoding utf8
          node -e "const p=require('./package.json'); console.log(JSON.stringify({scripts:p.scripts,devDependencies:p.devDependencies,dependencies:p.dependencies},null,2))" 2>&1 | Out-File $out -Append -Encoding utf8
          "`n=== npm ls relevant packages ===" | Out-File $out -Append -Encoding utf8
          npm ls --depth=1 vitest @cloudflare/vitest-pool-workers workerd 2>&1 | Out-File $out -Append -Encoding utf8
          "`n=== tests/worker/runtime.test.js numbered ===" | Out-File $out -Append -Encoding utf8
          $n=0; Get-Content .\tests\worker\runtime.test.js | ForEach-Object { $n++; ('{0,4}: {1}' -f $n, $_) } | Out-File $out -Append -Encoding utf8
          "`n=== candidate vitest/wrangler config files ===" | Out-File $out -Append -Encoding utf8
          Get-ChildItem -File -Path . -Filter '*vitest*' | Select-Object -ExpandProperty FullName | Out-File $out -Append -Encoding utf8
          Get-ChildItem -File -Path . -Filter 'wrangler*' | Select-Object -ExpandProperty FullName | Out-File $out -Append -Encoding utf8
          Get-Content $out | Write-Host

      - name: Prove ordinary Worker test still passes immediately before release runner
        working-directory: work
        run: npm run test:worker

      - name: Run complete one-process Windows release certification with durable capture
        id: inner_release
        continue-on-error: true
        shell: pwsh
        working-directory: work
        run: |
          $output = Join-Path $PWD 'windows-runtime-release-output.log'
          $transcript = Join-Path $PWD 'windows-runtime-release-transcript.log'
          $exitFile = Join-Path $PWD 'windows-runtime-release-exit-code.txt'
          Remove-Item $output,$transcript,$exitFile -Force -ErrorAction SilentlyContinue
          $code = 1
          Start-Transcript -Path $transcript -Force
          try {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\RELEASE-WINDOWS.ps1 2>&1 | Tee-Object -FilePath $output
            $code = $LASTEXITCODE
          }
          catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath $output -Append | Write-Host
            $code = 1
          }
          finally {
            try { Stop-Transcript | Out-Null } catch {}
          }
          Set-Content -Path $exitFile -Value $code -Encoding utf8
          Write-Host "Inner RELEASE-WINDOWS.ps1 exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Capture release-temp Worker source and config after failure/success
        if: always()
        shell: pwsh
        working-directory: work
        run: |
          $dest = Join-Path $PWD 'release-temp-evidence'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $index = Join-Path $dest 'index.txt'
          "RUNNER_TEMP=$env:RUNNER_TEMP" | Out-File $index -Encoding utf8
          $dirs = Get-ChildItem -Path $env:RUNNER_TEMP -Directory -Filter 'ctw-release-*' -ErrorAction SilentlyContinue
          foreach ($d in $dirs) {
            "`n=== $($d.FullName) ===" | Out-File $index -Append -Encoding utf8
            Get-ChildItem -Path $d.FullName -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @('runtime.test.js','package.json','package-lock.json','vitest.config.js','vitest.config.mjs','vitest.config.ts','wrangler.toml') -or $_.Name -like '*.log' -or $_.Name -like '*.txt' } |
              ForEach-Object {
                $_.FullName | Out-File $index -Append -Encoding utf8
                $relative = $_.FullName.Substring($d.FullName.Length).TrimStart('\')
                $target = Join-Path $dest (Join-Path $d.Name $relative)
                New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
                Copy-Item $_.FullName $target -Force
              }
          }
          Get-Content $index | Write-Host

      - name: Upload Windows packaged Worker diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-runtime-config-diagnostic
          path: |
            work/windows-runtime-pre-release-context.txt
            work/windows-runtime-release-output.log
            work/windows-runtime-release-transcript.log
            work/windows-runtime-release-exit-code.txt
            work/release-temp-evidence
            work/tests/worker/runtime.test.js
            work/package.json
            work/package-lock.json
            work/RELEASE-WINDOWS.ps1
            work/vitest.config.*
            work/wrangler.toml
          if-no-files-found: warn
          retention-days: 3

      - name: Require inner release result after evidence upload
        if: always()
        shell: pwsh
        working-directory: work
        run: |
          $exitFile = '.\windows-runtime-release-exit-code.txt'
          if (-not (Test-Path $exitFile)) { throw 'Inner release exit-code evidence is missing.' }
          $code = (Get-Content $exitFile -Raw).Trim()
          if ($code -ne '0') { throw "Inner release runner failed with exit code $code; diagnostic evidence uploaded." }

      - name: Publish diagnostic run URL
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $target = "$env:SERVER_URL/$env:REPOSITORY/actions/runs/$env:RUN_ID"
          $state = if ('${{ steps.inner_release.outcome }}' -eq 'success') { 'success' } else { 'failure' }
          $body = @{ state=$state; context='cosmic-windows-runtime-diagnostic-run'; description='Windows packaged Worker runtime diagnostic'; target_url=$target } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "$env:API_URL/repos/$env:REPOSITORY/statuses/$env:HEAD_SHA" -Headers @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
          Write-Host "Diagnostic run: $target"
