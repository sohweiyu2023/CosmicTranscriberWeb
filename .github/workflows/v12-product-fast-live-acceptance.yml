name: V1.2 Product Fast Live Acceptance

on:
  push:
    branches:
      - dev/v1.2.0-product-fast
    paths:
      - '.github/workflows/v12-product-fast-live-acceptance.yml'
      - 'tools/v12-live-staging-acceptance.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_STAGING_WORKER_VERSION_ID: fe7ee9ea-f4b1-404b-a570-1eb58468ce50
  CERTIFIED_STAGING_ARTIFACT_SHA256: fbce0a019ed435a9e9e07969f33e1ebb8b3b68cf115d87e720ed6ba47f952051
  CERTIFIED_V12_LOCK_SHA256: 90c85c65637a2e243273a13438cb23a9a51c3d1aea80236ecf4983df4876b85d

jobs:
  live-api-acceptance:
    name: Exact authenticated live staging API acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_CF_AUTHORIZATION: ${{ secrets.STAGING_CF_AUTHORIZATION }}
      STAGING_OPENAI_API_KEY: ${{ secrets.STAGING_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
      - name: Install exact npm 12.0.2
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Fail closed unless live staging credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v26.7.0'
          test "$(npm --version)" = '12.0.2'
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing staging environment secret CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing staging environment secret CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          test -n "${STAGING_CF_AUTHORIZATION:-}" || { echo 'Missing staging environment secret STAGING_CF_AUTHORIZATION' >&2; exit 1; }
          test -n "${STAGING_OPENAI_API_KEY:-}" || { echo 'Missing staging environment secret STAGING_OPENAI_API_KEY' >&2; exit 1; }
          echo 'Required live-acceptance secrets are present (values intentionally not printed).'
      - name: Provision deterministic tiny live fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          fixture="$RUNNER_TEMP/v12-live-fixtures"
          mkdir -p "$fixture"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=440:duration=1' -ac 1 -ar 16000 "$fixture/format.wav"
          ffmpeg -hide_banner -loglevel error -y -i "$fixture/format.wav" -c:a libmp3lame -b:a 32k "$fixture/format.mp3"
          ffmpeg -hide_banner -loglevel error -y -i "$fixture/format.wav" -c:a flac "$fixture/format.flac"
          ffmpeg -hide_banner -loglevel error -y -i "$fixture/format.wav" -c:a aac -b:a 32k "$fixture/format.m4a"
          ffmpeg -hide_banner -loglevel error -y -i "$fixture/format.wav" -c:a aac -b:a 32k "$fixture/format.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$fixture/format.wav" -c:a libvorbis -q:a 2 "$fixture/format.ogg"
          ffmpeg -hide_banner -loglevel error -y -i "$fixture/format.wav" -c:a libopus -b:a 24k "$fixture/format.webm"
          # Use a real MPEG Program Stream for .mpeg; renaming a raw MP3 is not a valid container-format test.
          ffmpeg -hide_banner -loglevel error -y -i "$fixture/format.wav" -c:a libmp3lame -b:a 32k -f mpeg "$fixture/format.mpeg"
          ffprobe -hide_banner -loglevel error -show_entries format=format_name -of default=noprint_wrappers=1 "$fixture/format.mpeg" | grep -qx "format_name=mpeg"
          # MPGA represents raw MPEG audio; exercise Layer II rather than merely renaming a Layer III MP3 fixture.
          ffmpeg -hide_banner -loglevel error -y -i "$fixture/format.wav" -c:a mp2 -b:a 64k -f mp2 "$fixture/format.mpga"
          ffprobe -hide_banner -loglevel error -show_entries stream=codec_name -of default=noprint_wrappers=1 "$fixture/format.mpga" | grep -qx "codec_name=mp2"
          for ext in mp3 flac mp4 mpeg mpga m4a ogg wav webm; do test -s "$fixture/format.$ext"; done
          echo "LIVE_FIXTURE_DIR=$fixture" >> "$GITHUB_ENV"
          echo 'Nine tiny deterministic live fixtures provisioned.'
      - name: Validate live acceptance harness syntax
        run: node --check tools/v12-live-staging-acceptance.mjs
      - name: Run genuine authenticated live staging API acceptance
        run: node tools/v12-live-staging-acceptance.mjs
      - name: Reassert production block
        shell: bash
        run: |
          set -euo pipefail
          echo "Accepted deployment remains pinned to Worker version ${EXPECTED_STAGING_WORKER_VERSION_ID}."
          echo "Historical package-certified artifact SHA-256: ${CERTIFIED_STAGING_ARTIFACT_SHA256}"
          echo "Historical certified dependency-lock SHA-256: ${CERTIFIED_V12_LOCK_SHA256}"
          echo 'Live API acceptance complete. releaseReady remains false; production remains blocked pending remaining live browser acceptance and final certification.'
