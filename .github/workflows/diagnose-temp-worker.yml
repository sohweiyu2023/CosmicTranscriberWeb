name: Diagnose Windows temp-path Worker verification 1.0.12

on:
  push:
    branches: ['diag/temp-worker-1.0.12']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  diagnose:
    name: Run identical packaged Worker suite across Windows locations
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish exact diagnostic run URL immediately
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          $body = @{ state='pending'; context='cosmic-temp-worker-diagnostic-run'; description='Exact Windows temp-path Worker diagnostic run'; target_url=$url } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri '${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}' -Headers @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
          Write-Host "Diagnostic run: $url"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Activate reviewed npm
        shell: pwsh
        run: |
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          if ((node --version).Trim() -ne 'v24.19.0') { throw "Wrong Node: $(node --version)" }
          if ((npm --version).Trim() -ne '12.0.2') { throw "Wrong npm: $(npm --version)" }
      - name: Download exact retained packaged source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-worker-diagnostic
          path: source-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31465010607
      - name: Run same source ZIP from D runner temp, C root, and Windows system temp
        id: matrix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip = Get-ChildItem source-evidence -Recurse -Filter '*-source.zip' -File | Select-Object -First 1
          if ($null -eq $zip) { throw 'Retained candidate source ZIP not found in downloaded evidence.' }
          $resultsDir = Join-Path $env:GITHUB_WORKSPACE 'temp-path-results'
          New-Item -ItemType Directory -Path $resultsDir -Force | Out-Null
          $locations = @(
            @{ Name='runner-temp-D'; Base=(Join-Path $env:RUNNER_TEMP ('ctw-worker-'+$env:GITHUB_RUN_ID)) },
            @{ Name='system-drive-C'; Base=(Join-Path $env:SystemDrive ('ctw-worker-'+$env:GITHUB_RUN_ID)) },
            @{ Name='os-temp-C'; Base=(Join-Path ([System.IO.Path]::GetTempPath()) ('ctw-worker-'+$env:GITHUB_RUN_ID)) }
          )
          $summary=@()
          foreach($loc in $locations){
            $name=$loc.Name; $base=$loc.Base
            Write-Host "=== LOCATION $name : $base ==="
            Remove-Item $base -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $base -Force | Out-Null
            Expand-Archive -Path $zip.FullName -DestinationPath $base -Force
            $root=Get-ChildItem $base -Directory | Select-Object -First 1
            if($null -eq $root){ throw "No source root for $name" }
            $installLog=Join-Path $resultsDir ($name+'-npm-ci.log')
            $workerLog=Join-Path $resultsDir ($name+'-worker.log')
            Push-Location $root.FullName
            try {
              & npm ci 2>&1 | Tee-Object -FilePath $installLog
              $ciCode=$LASTEXITCODE
              if($ciCode -eq 0){
                & npm run test:worker 2>&1 | Tee-Object -FilePath $workerLog
                $workerCode=$LASTEXITCODE
              } else { $workerCode=999 }
            } finally { Pop-Location }
            $summary += [pscustomobject]@{location=$name;base=$base;npmCi=$ciCode;worker=$workerCode}
            Write-Host "RESULT $name npmCi=$ciCode worker=$workerCode"
          }
          $summary | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $resultsDir 'results.json') -Encoding utf8
          $summary | Format-Table -AutoSize | Out-String -Width 220 | Tee-Object -FilePath (Join-Path $resultsDir 'results.txt') | Write-Host
      - name: Upload temp-path diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temp-path-worker-diagnostic
          path: temp-path-results
          if-no-files-found: error
          retention-days: 3
