name: V1.2 Inspect Recovered Provider Boundary

on:
  push:
    branches: [dev/v1.2.0-product-fast]
    paths: ['.github/workflows/v12-inspect-recovered-provider.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Retrieve verified non-certified source archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovered"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/11679016923/zip" > "$RUNNER_TEMP/recovered.zip"
          printf '%s  %s\n' c3755ab387b38549ef70f12a783f0d1511d301f3b5d4e58c26e0a0a465a2c741 "$RUNNER_TEMP/recovered.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/recovered.zip" -d "$RUNNER_TEMP/recovered"
          echo 'SOURCE_SCRIPTS:'
          find "$RUNNER_TEMP/recovered/src" -maxdepth 3 -type f -printf '%P\n' | sort
          echo 'PROVIDER_BOUNDARY_MATCHES:'
          grep -R -n -E 'form\.append|formData\.append|FormData\(|filename|openai\.com/v1/audio|\.mpga|audioFormat' "$RUNNER_TEMP/recovered/src" | head -100 || true
          echo 'This is non-certified reviewed source; no product deployment or promotion.'
