name: Validate V1.2 Batch 5 MPEG EOF hardening

on:
  push:
    branches: ['dev/v1.2.0-ci-source-20260821']
    paths:
      - '.github/workflows/validate-v12-batch5-mpeg-eof.yml'
      - 'tools/v12-batch5-mpeg-eof-hardening.mjs'
      - 'tools/v12-reconstruct-through-batch5.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cosmic-v12-batch5-mpeg-eof
  cancel-in-progress: false

env:
  V12_ROOT: ${{ runner.temp }}/v12-batch5/CosmicTranscriberWeb-1.2.0-dev

jobs:
  exact-runtime-billing-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041 # v6.4.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false
      - name: Reconstruct exact candidate through Batch 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v26.7.0'
          test "$(npm --version)" = '12.0.2'
          bash tools/v12-reconstruct-through-batch5.sh "$V12_ROOT"
      - name: Focused MPEG signature and static billing safeguards
        working-directory: ${{ runner.temp }}/v12-batch5/CosmicTranscriberWeb-1.2.0-dev
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/node/audio-formats.test.mjs
          npm run audit:static
          test "$(node -p "require('./RELEASE_MANIFEST.json').releaseReady")" = 'false'
      - name: Exact dependency, mutation, Worker and integration regression
        working-directory: ${{ runner.temp }}/v12-batch5/CosmicTranscriberWeb-1.2.0-dev
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run deps:install-scripts:verify
          npm audit
          npm run test:mutation
          npm run test:worker
          npm run test:integration
          npm run build:inspect
          test "$(node -p "require('./RELEASE_MANIFEST.json').releaseReady")" = 'false'
      - name: Confirm production and staging remain untouched
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('$V12_ROOT/RELEASE_MANIFEST.json').releaseReady")" = 'false'
          echo 'Batch 5 validation only. No deploy commands executed; production V1.1.1 and staging untouched.'
