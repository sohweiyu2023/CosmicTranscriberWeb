name: Materialize authoritative V1.2 product tree

on:
  push:
    branches: ['dev/v1.2.0-ci-source-20260821']
    paths:
      - '.github/workflows/materialize-v12-batch4-review-source-r2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cosmic-v12-authoritative-materialization
  cancel-in-progress: false

env:
  V12_ROOT: ${{ runner.temp }}/v12-authoritative/CosmicTranscriberWeb-1.2.0-dev
  TARGET_BRANCH: dev/v1.2.0-product-authoritative

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041 # v6.4.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Reconstruct exact V1.2 source through Batch 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v26.7.0'
          test "$(npm --version)" = '12.0.2'
          bash tools/v12-reconstruct-through-batch5.sh "$V12_ROOT"
          test "$(node -p "require('$V12_ROOT/package.json').version")" = '1.2.0'
          test "$(node -p "require('$V12_ROOT/RELEASE_MANIFEST.json').releaseReady")" = 'false'

      - name: Core exact-runtime product gate
        working-directory: ${{ runner.temp }}/v12-authoritative/CosmicTranscriberWeb-1.2.0-dev
        shell: bash
        run: |
          set -euo pipefail
          npm run validate
          npm run audit:static
          npm run audit:secrets
          npm run fixtures:verify
          npm ci
          npm run deps:install-scripts:verify
          npm audit
          npm run test:mutation
          npm run test:worker
          npm run test:integration
          npm run build:inspect
          test "$(node -p "require('./RELEASE_MANIFEST.json').releaseReady")" = 'false'

      - name: Publish authoritative directly executable product branch
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing authoritative branch: $TARGET_BRANCH" >&2
            exit 1
          fi
          rm -rf "$V12_ROOT/node_modules" "$V12_ROOT/dist" "$V12_ROOT/coverage" "$V12_ROOT/.wrangler" "$V12_ROOT/evidence" "$V12_ROOT/test-results" "$V12_ROOT/playwright-report" "$V12_ROOT/blob-report" "$V12_ROOT/.git"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan v12-authoritative-materialized
          git rm -rf .
          git clean -fdx
          (cd "$V12_ROOT" && tar -cf - .) | tar -xf -
          cat > V1.2_AUTHORITATIVE_SOURCE.json <<EOF
          {
            "schema": "cosmic-v12-authoritative-source-1",
            "version": "1.2.0",
            "sourceShellCommit": "$SOURCE_SHA",
            "throughBatch": 5,
            "exactNode": "26.7.0",
            "exactNpm": "12.0.2",
            "coreGatePassedBeforePublish": true,
            "releaseReady": false,
            "v12Certified": false,
            "productionV111Touched": false,
            "stagingTouched": false
          }
          EOF
          test -f package.json
          test -f package-lock.json
          test -f RELEASE_MANIFEST.json
          test "$(node -p "require('./package.json').version")" = '1.2.0'
          test "$(node -p "require('./RELEASE_MANIFEST.json').releaseReady")" = 'false'
          git add -A
          git diff --cached --check
          git commit -m 'Materialize authoritative V1.2 product tree through Batch 5'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
