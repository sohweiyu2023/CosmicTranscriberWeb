name: Exact workerd static provenance (review only)
on:
  push:
    branches: [review/pr57-workerd-static-v2-20261123]
    paths: [.github/workflows/pr57-workerd-static-v2.yml]
permissions:
  contents: read
jobs:
  static:
    if: github.repository == 'sohweiyu2023/CosmicTranscriberWeb' && github.event_name == 'push' && github.ref == 'refs/heads/review/pr57-workerd-static-v2-20261123' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify fixed npm archives without installing anything
        shell: bash
        run: |
          set -euo pipefail
          base=a5425972f37c643b3d564a821a5f04b8929d3710
          test "$(git rev-list --parents -n1 HEAD)" = "$GITHUB_SHA $base"
          test "$(git diff --name-only "$base" HEAD)" = ".github/workflows/pr57-workerd-static-v2.yml"
          test "$(git hash-object .github/workflows/ci.yml)" = "9a4e0e8c9eb87c7b3ec7933ed02693bc44282519"
          mkdir -m 700 "$RUNNER_TEMP/workerd-proof"
          env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -B - "$RUNNER_TEMP/workerd-proof" "$GITHUB_SHA" <<'PY'
          import base64, hashlib, json, pathlib, sys, tarfile, tempfile
          from urllib.request import Request, build_opener, HTTPRedirectHandler, ProxyHandler
          output, sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          old_lock = pathlib.Path("package-lock.json").read_bytes()
          old_hash = "7cedd070f9d628ead68c55b56e449d6933eb4642c11ea0a1cb4bb48a935f17b8"
          new_hash = "fa1492c206a7deed71e80d31b60faeaf58ae46ea72383f331e1346e23f401ec9"
          assert hashlib.sha256(old_lock).hexdigest() == old_hash
          pins = [
              ["workerd","1.20261110.1","GKdtki7t19f16vegol8Iw5Dh0mnjHLuwLx8rlhTPvyRBEXM0Osl9eYexWAW8uZD7OMw4WKNq9yvENg5kPDUJ9w=="],
              ["workerd","1.20261119.1","lalSvY+ad5asqMgzA/DfrZo7wvuvOHJc/aS1UctUrwu76fJE/LkSKJlprfBu0LeU79Qai5d+xFooQA9CIfj+dQ=="],
              ["@cloudflare/workerd-darwin-64","1.20261119.1","yotoiTGXCl1gTRX+y5ZWSAmzAg6CcBJXhJL6C1DGWUhsjjezNe8FdzraNsefVTOeKsOid2EC+hqOzewczKLvmQ=="],
              ["@cloudflare/workerd-darwin-arm64","1.20261119.1","VPOmfEmMubvw4SPcg/yDgamQXsiVAENgxeCJO8pDggRJFaF93SP0g/hktD8sbfmWBS19BO1kX1EsdgHSgRL9jA=="],
              ["@cloudflare/workerd-linux-64","1.20261119.1","aaDf78smiN12Uuwtg6TG6iLVS61sLpy/7DC5PYORf2+TCYw/bygcaqqb8zQJ+XwZ3xYhm/Ws80c/yMMhCMTFYA=="],
              ["@cloudflare/workerd-linux-arm64","1.20261119.1","LkyAvTMcKqRUP73HRScWWwTSz3pw09um1hxR+rcGdvsGzao8IR59XXTp/tul6kFdVBL2mD8U3X6j2O8t7I4viw=="],
              ["@cloudflare/workerd-windows-64","1.20261119.1","y4RO3QFNWt4j4uq2kmP5tklTvdA3qOA0PXuA66vsCmEtZYYb71ldefJcq5Dt0jrexKf/i4BBaLXZMVYLnohb0g=="],
          ]
          old = json.loads(old_lock)["packages"]["node_modules/workerd"]
          assert old["version"] == pins[0][1] and old["integrity"] == "sha512-" + pins[0][2]
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError("Registry redirect refused")
          http = build_opener(ProxyHandler({}), NoRedirect())
          rows = []
          for idx, (name, version, pin) in enumerate(pins):
              short = name.split("/")[-1]
              url = f"https://registry.npmjs.org/{name}/-/{short}-{version}.tgz"
              h, s, size = hashlib.sha512(), hashlib.sha256(), 0
              with tempfile.TemporaryFile(dir=output.parent) as raw:
                  req = Request(url, headers={"User-Agent": "Cosmic-Static-Provenance/2"})
                  with http.open(req, timeout=25) as r:
                      assert r.status == 200 and r.geturl() == url
                      while chunk := r.read(1024 * 1024):
                          size += len(chunk)
                          assert size <= 80 * 1024 * 1024
                          h.update(chunk); s.update(chunk); raw.write(chunk)
                  assert base64.b64encode(h.digest()).decode() == pin, name
                  raw.seek(0)
                  text_paths = {"package/package.json"}
                  if name == "workerd":
                      text_paths |= {"package/install.js", "package/lib/main.js"}
                  kept, seen, expanded = {}, set(), 0
                  with tarfile.open(fileobj=raw, mode="r|gz") as tar:
                      for m in tar:
                          pp = pathlib.PurePosixPath(m.name)
                          assert pp.parts and pp.parts[0] == "package" and ".." not in pp.parts and not pp.is_absolute()
                          assert m.name not in seen and len(seen) < 128 and (m.isfile() or m.isdir())
                          seen.add(m.name)
                          expanded += m.size
                          assert expanded <= 300 * 1024 * 1024
                          if m.name in text_paths and m.isfile():
                              assert 0 < m.size <= 512 * 1024
                              data = tar.extractfile(m).read(m.size + 1)
                              assert len(data) == m.size and 0 not in data
                              data.decode("utf-8", "strict")
                              kept[m.name] = data
              meta = json.loads(kept["package/package.json"])
              assert (meta["name"],meta["version"]) == (name,version)
              scripts = meta.get("scripts", {})
              if name == "workerd":
                  assert scripts == {"postinstall": "node install.js"} and "package/install.js" in kept
                  assert meta.get("optionalDependencies") == {p[0]:version for p in pins[2:]}
              else:
                  assert not scripts, name
              files = {}
              for member,data in sorted(kept.items()):
                  dest = f"{idx}-{short}-{member.split('/')[-1]}.txt"
                  (output/dest).write_bytes(data)
                  files[member] = {"file":dest,"sha256":hashlib.sha256(data).hexdigest()}
              rows.append({"package":name,"version":version,"url":url,"bytes":size,"sha256":s.hexdigest(),"matchedLockIntegrity":"sha512-"+pin,"scripts":scripts,"text":files})
          manifest = {"schema":"cosmic-workerd-static-v2","producerCommit":sha,"resolverRun":45042098322,"resolverArtifact":14761888683,"oldLockSha256":old_hash,"reviewedLockSha256":new_hash,"mode":"static-only, no installation or allowlist change","packages":rows}
          (output/"provenance.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cosmic-workerd-static-v2-${{ github.sha }}
          path: ${{ runner.temp }}/workerd-proof/
          if-no-files-found: error
          retention-days: 5
