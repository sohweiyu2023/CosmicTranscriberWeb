name: Diagnose Vitest Windows fresh-install release sequence

on:
  push:
    branches: ['diag/vitest-windows-runtime-1.0.12']
  pull_request:
    branches: ['ci/1.0.12']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install-release-sequence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Materialize reviewed source and durable repairs
        shell: pwsh
        run: |
          python .ci/materialize.py
          python .ci/repair_integration.py
          python .ci/repair_e2e.py
          python .ci/repair_install_policy.py
          python .ci/repair_vitest_windows.py
          python .ci/repair_vitest_windows_mutation_guard.py
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Activate exact npm and provision fixture toolchain
        shell: pwsh
        run: |
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          if ((node --version).Trim() -ne 'v24.19.0') { throw "Unexpected Node: $(node --version)" }
          if ((npm --version).Trim() -ne '12.0.2') { throw "Unexpected npm: $(npm --version)" }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { throw 'ffmpeg/ffprobe provisioning failed.' }
      - name: Resolve exact graph and build source seed
        working-directory: work
        shell: pwsh
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed while resolving seed lock.' }
          npm run deps:install-scripts:verify
          if ($LASTEXITCODE -ne 0) { throw 'install-script policy failed.' }
          npm rebuild
          if ($LASTEXITCODE -ne 0) { throw 'npm rebuild failed.' }
          npm audit
          if ($LASTEXITCODE -ne 0) { throw 'npm audit failed.' }
          node scripts/generate-test-fixtures.mjs
          if ($LASTEXITCODE -ne 0) { throw 'fixture generation failed.' }
          $seed = Join-Path $env:RUNNER_TEMP 'ctw-vitest-seed'
          Remove-Item $seed -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $seed | Out-Null
          Get-ChildItem . -Force | Where-Object Name -ne 'node_modules' | Copy-Item -Destination $seed -Recurse -Force
          Write-Host "Seed=$seed"
      - name: Stress 10 independent fresh installs through exact release pre-Worker sequence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seed = Join-Path $env:RUNNER_TEMP 'ctw-vitest-seed'
          $summary = Join-Path $env:RUNNER_TEMP 'fresh-install-release-sequence-summary.txt'
          Remove-Item $summary -Force -ErrorAction SilentlyContinue

          function Run-Checked([string]$label, [string]$log, [scriptblock]$command) {
            Add-Content $log "`n=== $label ==="
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $command *>&1 | Tee-Object -FilePath $log -Append | Out-Host
            $code = $LASTEXITCODE
            $ErrorActionPreference = $old
            if ($code -ne 0) { throw "$label failed with exit $code" }
          }

          1..10 | ForEach-Object {
            $i = $_
            $dir = Join-Path $env:TEMP ("ctw-fresh-release-seq-$i-" + [guid]::NewGuid().ToString('N'))
            $log = Join-Path $env:RUNNER_TEMP ("fresh-install-$i.txt")
            New-Item -ItemType Directory -Path $dir | Out-Null
            Get-ChildItem $seed -Force | Copy-Item -Destination $dir -Recurse -Force
            Add-Content $summary "iteration=$i dir=$dir"
            Push-Location $dir
            try {
              Run-Checked 'npm ci' $log { npm ci }
              Run-Checked 'validate:version' $log { npm run validate:version }
              Run-Checked 'deps:lock:verify' $log { npm run deps:lock:verify }
              Run-Checked 'deps:check' $log { npm run deps:check }
              Run-Checked 'deps:install-scripts:verify' $log { npm run deps:install-scripts:verify }
              Run-Checked 'validate:powershell' $log { npm run validate:powershell }
              Run-Checked 'npm audit' $log { npm audit }
              Run-Checked 'validate' $log { npm run validate }
              $before = @(Get-Process workerd -ErrorAction SilentlyContinue).Count
              Add-Content $log "workerd_before=$before"
              Run-Checked 'test:worker' $log { npm run test:worker }
              $after = @(Get-Process workerd -ErrorAction SilentlyContinue).Count
              Add-Content $log "workerd_after=$after"
              Add-Content $summary "iteration=$i PASS workerd_before=$before workerd_after=$after"
            } catch {
              Add-Content $summary "iteration=$i FAIL $($_.Exception.Message)"
              Get-Content $log | Select-Object -Last 180 | Out-Host
              throw
            } finally {
              Pop-Location
              Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host '=== FRESH INSTALL RELEASE-SEQUENCE SUMMARY ==='
          Get-Content $summary
          Write-Host '10/10 independent fresh installs passed exact release pre-Worker sequence with zero retries.'
      - name: Preserve fresh-install stress evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-fresh-install-release-sequence
          path: |
            ${{ runner.temp }}/fresh-install-release-sequence-summary.txt
            ${{ runner.temp }}/fresh-install-*.txt
          if-no-files-found: warn
          retention-days: 3
