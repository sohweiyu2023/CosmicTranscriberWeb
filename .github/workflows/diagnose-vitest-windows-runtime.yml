name: Diagnose Vitest Windows runtime casing

on:
  push:
    branches: ['diag/vitest-windows-runtime-1.0.12']
  pull_request:
    branches: ['ci/1.0.12']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-vitest-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Materialize reviewed source
        shell: pwsh
        run: python .ci/materialize.py
      - name: Apply existing reviewed repairs
        shell: pwsh
        run: |
          python .ci/repair_integration.py
          python .ci/repair_e2e.py
          python .ci/repair_install_policy.py
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install exact current dependency graph without lifecycle scripts
        working-directory: work
        shell: pwsh
        run: |
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          if ((node --version).Trim() -ne 'v24.19.0') { throw "Unexpected Node: $(node --version)" }
          if ((npm --version).Trim() -ne '12.0.2') { throw "Unexpected npm: $(npm --version)" }
          npm install --ignore-scripts --no-audit --no-fund
          $pkg = Get-Content node_modules\vitest\package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '4.1.10') { throw "Expected vitest 4.1.10, found $($pkg.version)" }
      - name: Locate compiled cached Vitest resolver
        working-directory: work
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root = Path('node_modules/vitest/dist')
          needles = ('normalizedDistDir', 'getCachedVitestImport', 'externalizeMap')
          hits = []
          for p in root.rglob('*.js'):
              text = p.read_text(encoding='utf-8')
              if 'normalizedDistDir' in text and 'externalizeMap' in text:
                  hits.append((p, text))
          print(f'candidate_count={len(hits)}')
          if len(hits) != 1:
              for p, _ in hits:
                  print('candidate', p.as_posix())
              raise SystemExit('Expected exactly one compiled Vitest cached-resolver target')
          p, text = hits[0]
          print('target=' + p.as_posix())
          for needle in needles:
              print(needle + '_count=' + str(text.count(needle)))
          idx = text.index('const normalizedDistDir')
          start = max(0, idx - 500)
          end = min(len(text), idx + 5000)
          print('--- BEGIN COMPILED RESOLVER EXCERPT ---')
          print(text[start:end])
          print('--- END COMPILED RESOLVER EXCERPT ---')
          '@ | python -
