name: V1.2 Independent Native Safari Investigation

# Diagnostic only; this workflow is never a release or staging gate.
# It runs separately from Windows ZIP certification to expose genuine
# native SafariDriver failures while Windows infrastructure is blocked.
on:
  push:
    branches: [ci/v1.2.0-production-readiness]
    paths:
      - '.github/workflows/safari-native-diagnostic.yml'
      - 'tests/safari/**'
      - 'tests/e2e/**'
      - 'public/js/**'
      - 'scripts/generate-test-fixtures.mjs'
  workflow_dispatch:
    inputs:
      include_driver:
        description: Also run the separate SafariDriver diagnostic (not needed for ordinary picker investigation)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  native-safari-diagnostic:
    if: ${{ github.event_name == 'push' || inputs.include_driver == true }}
    name: Real SafariDriver diagnostics (not release certification)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26.7.0'
          package-manager-cache: false
      - name: Activate pinned npm and check toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v26.7.0'
          test "$(npm --version)" = '12.0.2'
      - name: Verify source identity and install reviewed dependencies
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          npm ci
          npm run deps:install-scripts:verify
          npm audit
      - name: Provision genuine native audio oracle
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Enable installed macOS SafariDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Probe genuine SafariDriver disk-file access across macOS locations (diagnostic only)
        continue-on-error: true
        run: node tests/safari/disk-access-probe.mjs
      - name: Run genuine SafariDriver disk-file/format/BYOK diagnostic
        run: npm run test:safari:real
      - name: Preserve native Safari evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: independent-real-safari-diagnostics
          path: |
            test-results/safari-native-acceptance.json
            test-results/safari-native-picker-panel.png
            test-results/safari-disk-access-probe.json
          if-no-files-found: warn
          retention-days: 7

  ordinary-safari-gui-diagnostic:
    name: Real ordinary Safari file picker (no WebDriver; diagnostic only)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26.7.0'
          package-manager-cache: false
      - name: Verify reviewed diagnostic sources and exact certified disk fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          # Original fixture/oracles match certified source4ec47b1f, ZIP SHA256
          # 91c5a4b1cf405c6c01836541c8b06b173f1f8b6fe7085b11fa266cec39c4f74f.
          # Probe/report changes add reviewed diagnostics only, not certification.
          cat > "$RUNNER_TEMP/ordinary-safari-reviewed.sha256" <<'REVIEWED'
          18cc2a716bb9a323ad7fc661cc6331a0bd10b19d8c4b2feea1be712de0cee670  tests/safari/ordinary-native-gui-probe.mjs
          b7d1e9ba9d70c08f02f227ce712c1b41f9c196cb1963baf33d470720198a9fc8  tests/safari/ordinary-native-runtime.mjs
          8bb15551acf7c20bf46466436e10e40b073443bb17836946ed9f4d96fcf2ee32  tests/safari/ordinary-native-file-contract.mjs
          34c46f4fd1d0ec6cef2a424958a613f7fd8340b753a1e4be26d9bcc9f351c0fd  tests/safari/ordinary-native-report-sanitize.mjs
          76538cb6310f56cfd50c80843842d611f5140769f761db4ebb5d9d3aa3dd944b  tests/safari/disk-access-probe-contract.mjs
          e799ee1a44f73c9a4b146e76cce9deae6390ebc2aad3f51da13ce9dda2182b55  tests/fixtures/format.mp3
          REVIEWED
          sha256sum -c "$RUNNER_TEMP/ordinary-safari-reviewed.sha256"
      - name: Use ordinary Safari and genuine native macOS file chooser (not WebDriver)
        timeout-minutes: 4
        env:
          COSMIC_ORDINARY_SAFARI_EXPECTED_VERSION: '27.2'
        run: node tests/safari/ordinary-native-gui-probe.mjs
      - name: Preserve ordinary Safari native picker evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ordinary-safari-native-picker-diagnostic
          path: |
            test-results/ordinary-safari-native-picker.json
            test-results/ordinary-safari-native-picker.png
            test-results/ordinary-safari-stage-*.png
          if-no-files-found: warn
          retention-days: 7
