name: Diagnose Windows same-drive package verification 1.0.12

on:
  push:
    branches: ['diag/windows-package-temp-fix-1.0.12']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  same-drive-release:
    name: Windows same-drive fresh-extraction full release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Materialize exact reviewed source snapshot
        shell: pwsh
        run: python .ci/materialize.py

      - name: Apply exact current certification repairs plus same-drive package verification repair
        shell: pwsh
        run: |
          python .ci/repair_integration.py
          python .ci/repair_e2e.py
          python .ci/repair_install_policy.py
          python .ci/repair_windows_package_temp.py

      - name: Restore exact reviewed lock and fixtures from current failed certification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reviewed-release-inputs
          path: reviewed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31472632201

      - name: Restore exact reviewed dependency graph and fixtures
        shell: pwsh
        run: |
          Copy-Item reviewed\package-lock.json work\package-lock.json -Force
          New-Item -ItemType Directory -Path work\tests\fixtures -Force | Out-Null
          Copy-Item reviewed\tests\fixtures\*.mp3 work\tests\fixtures\ -Force
          Write-Host "Workspace root: $((Resolve-Path work).Path)"
          Write-Host "System TEMP: $env:TEMP"
          Write-Host "Package verifier now uses workspace parent on Windows: $((Resolve-Path .).Path)"

      - name: Provision media validation toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) { throw 'ffmpeg/ffprobe provisioning failed.' }
          & $ffmpeg.Source -version | Select-Object -First 1
          & $ffprobe.Source -version | Select-Object -First 1

      - name: Run complete one-process Windows release with same-drive fresh extraction
        id: inner_release
        continue-on-error: true
        shell: pwsh
        working-directory: work
        run: |
          $output = Join-Path $PWD 'same-drive-release-output.log'
          $transcript = Join-Path $PWD 'same-drive-release-transcript.log'
          $exitFile = Join-Path $PWD 'same-drive-release-exit-code.txt'
          Remove-Item $output,$transcript,$exitFile -Force -ErrorAction SilentlyContinue
          $code = 1
          Start-Transcript -Path $transcript -Force
          try {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\RELEASE-WINDOWS.ps1 2>&1 | Tee-Object -FilePath $output
            $code = $LASTEXITCODE
          }
          catch {
            $_ | Format-List * -Force | Out-String | Tee-Object -FilePath $output -Append | Write-Host
            $code = 1
          }
          finally {
            try { Stop-Transcript | Out-Null } catch {}
          }
          Set-Content -Path $exitFile -Value $code -Encoding utf8
          Write-Host "Inner RELEASE-WINDOWS.ps1 exit code: $code"
          if ($code -ne 0) { exit $code }

      - name: Upload same-drive diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-same-drive-package-diagnostic
          path: |
            work/same-drive-release-output.log
            work/same-drive-release-transcript.log
            work/same-drive-release-exit-code.txt
            work/RELEASE-WINDOWS.ps1
            work/scripts/verify-source-package.mjs
            work/package.json
            work/package-lock.json
            work/test-results
            work/playwright-report
            work/blob-report
            CosmicTranscriberWeb-1.0.12-source.zip
          if-no-files-found: warn
          retention-days: 3

      - name: Require exact inner release success after evidence upload
        if: always()
        shell: pwsh
        working-directory: work
        run: |
          $exitFile = '.\same-drive-release-exit-code.txt'
          if (-not (Test-Path $exitFile)) { throw 'Inner release exit-code evidence is missing.' }
          $code = (Get-Content $exitFile -Raw).Trim()
          if ($code -ne '0') { throw "Same-drive inner release failed with exit code $code; diagnostics uploaded." }

      - name: Publish diagnostic run URL
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $target = "$env:SERVER_URL/$env:REPOSITORY/actions/runs/$env:RUN_ID"
          $state = if ('${{ steps.inner_release.outcome }}' -eq 'success') { 'success' } else { 'failure' }
          $body = @{ state=$state; context='cosmic-windows-package-temp-diagnostic-run'; description='Windows same-drive fresh-extraction full release'; target_url=$target } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "$env:API_URL/repos/$env:REPOSITORY/statuses/$env:HEAD_SHA" -Headers @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' } -ContentType 'application/json' -Body $body | Out-Null
          Write-Host "Diagnostic run: $target"
