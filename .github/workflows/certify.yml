name: Cosmic Transcriber Web 1.2.0 Certification Guard

on:
  push:
    branches: ['dev/v1.2.0-ci-source-20260821', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# IMPORTANT:
# This branch currently contains only the CI/documentation shell, not the
# complete CosmicTranscriberWeb-1.2.0-dev application source. Until the exact
# V1.2 source and executable F4 release matrix are synchronized, certification
# must fail closed. Fast Development Mode never substitutes for F4.

jobs:
  source-provenance-guard:
    name: V1.2 exact-source provenance required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate fail-closed provenance and fast-mode tooling
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/v12-regression-audit.mjs
          node --check tools/v12-critical-change-review.mjs
          node --check tools/test-v12-provenance-tools.mjs
          node --check tools/test-v12-critical-deletion-review.mjs
          node --check tools/v12-fast-gate-plan.mjs
          node --check tools/test-v12-fast-gate-plan.mjs
          node --check tools/v12-fast-changed-files.mjs
          node --check tools/test-v12-fast-changed-files.mjs
          node --check tools/v12-certification-readiness.mjs
          node --check tools/test-v12-certification-readiness.mjs
          node tools/test-v12-provenance-tools.mjs
          node tools/test-v12-critical-deletion-review.mjs
          node tools/test-v12-fast-gate-plan.mjs
          node tools/test-v12-fast-changed-files.mjs
          node tools/test-v12-certification-readiness.mjs
          printf 'V1.2 dependency-free provenance and fast-mode tooling self-tests: PASS\n'

      - name: Check exact V1.2 source readiness
        shell: bash
        run: |
          set -euo pipefail
          node tools/v12-certification-readiness.mjs --root . --json > .v12-certification-readiness.json || {
            cat .v12-certification-readiness.json >&2
            printf '\nV1.2 certification BLOCKED before product execution.\n' >&2
            printf 'Production V1.1.1 remains untouched; releaseReady remains false.\n' >&2
            exit 1
          }
          cat .v12-certification-readiness.json

      - name: Refuse certification until executable F4 matrix is wired
        shell: bash
        run: |
          set -euo pipefail
          printf 'V1.2 source identity/readiness markers passed, but certification is still BLOCKED.\n' >&2
          printf 'The exact certified V1.1.1 baseline provenance is already recovered and hard-pinned in the schema-v5 tools.\n' >&2
          printf 'Required next: materialize that exact certified V1.1.1 source tree, run schema-v5 regression audit and critical-change review,\n' >&2
          printf 'then execute the complete Node 26.7.0/npm 12.0.2 functional/static/mutation, nine-format, Worker/integration/browser/platform,\n' >&2
          printf 'Windows, Safari/macOS, package-integrity, fresh-ZIP, rollback and staging-acceptance gates.\n' >&2
          printf 'This guard intentionally exits non-zero until those executable F4 gates are wired and genuinely pass.\n' >&2
          exit 1
