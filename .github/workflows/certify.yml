name: Cosmic Transcriber Web 1.2.0 Certification Guard

on:
  push:
    branches: ['dev/v1.2.0-ci-source-20260821', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# IMPORTANT:
# This branch currently contains only the CI/documentation shell, not the
# complete CosmicTranscriberWeb-1.2.0-dev application source. The historical
# 1.0.12 certification workflow previously present here was unsafe to retain:
# it used Node 24.19.0, MP3-only fixture transfer and 1.0.12 artifact names.
# Until the exact V1.2 source is synchronized, CI must fail closed rather than
# emit evidence that could be mistaken for V1.2 release certification.

jobs:
  source-provenance-guard:
    name: V1.2 exact-source provenance required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Refuse certification of CI/documentation shell
        shell: bash
        run: |
          set -euo pipefail

          required=(
            package.json
            package-lock.json
            app.js
            wrangler.toml
            scripts/validate.mjs
            tests
          )

          missing=()
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              missing+=("$path")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'V1.2 certification BLOCKED: exact application source is not synchronized to this branch.\n' >&2
            printf 'Missing required source markers:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            printf '\nDo not interpret any CI result from this shell branch as V1.2 certification.\n' >&2
            printf 'Production V1.1.1 must remain untouched. releaseReady must remain false.\n' >&2
            exit 1
          fi

          printf 'Source markers are present, but this guard intentionally does not certify V1.2.\n' >&2
          printf 'Restore the reviewed V1.2 certification workflow only after exact source synchronization,\n' >&2
          printf 'including Node 26.7.0/npm 12.0.2, nine-format fixtures, Worker/integration/browser\n' >&2
          printf 'matrices, Windows release certification, fresh-ZIP revalidation and all-green aggregation.\n' >&2
          exit 1
