name: Cosmic Transcriber Web 1.2.0 Certification Guard

on:
  push:
    branches: ['dev/v1.2.0-ci-source-20260821', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# IMPORTANT:
# This branch currently contains only the CI/documentation shell, not the
# complete CosmicTranscriberWeb-1.2.0-dev application source. Until the exact
# V1.2 source is synchronized, certification must fail closed.
# Fast Development Mode changes feedback cadence only; it never substitutes
# for the complete F4 release matrix.

jobs:
  source-provenance-guard:
    name: V1.2 exact-source provenance required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate fail-closed provenance and fast-mode tooling
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/v12-regression-audit.mjs
          node --check tools/v12-critical-change-review.mjs
          node --check tools/test-v12-provenance-tools.mjs
          node --check tools/v12-fast-gate-plan.mjs
          node --check tools/test-v12-fast-gate-plan.mjs
          node tools/test-v12-provenance-tools.mjs
          node tools/test-v12-fast-gate-plan.mjs
          printf 'V1.2 dependency-free provenance and fast-mode tooling self-tests: PASS\n'

      - name: Validate source identity, then refuse certification
        shell: bash
        run: |
          set -euo pipefail

          required=(
            package.json
            package-lock.json
            app.js
            wrangler.toml
            RELEASE_MANIFEST.json
            scripts/validate.mjs
            tests
          )

          missing=()
          for p in "${required[@]}"; do
            [[ -e "$p" ]] || missing+=("$p")
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'V1.2 certification BLOCKED: exact application source is not synchronized.\n' >&2
            printf 'Missing required source markers:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            printf 'Production V1.1.1 must remain untouched; releaseReady must remain false.\n' >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch (error) {
              console.error(`V1.2 provenance BLOCKED: ${file} is invalid JSON: ${error.message}`);
              process.exit(1);
            }
          }
          const pkg = readJson('package.json');
          const manifest = readJson('RELEASE_MANIFEST.json');
          const failures = [];
          if (pkg.version !== '1.2.0') failures.push(`package.json version=${JSON.stringify(pkg.version)}`);
          if (manifest.product !== 'Cosmic Transcriber Web') failures.push(`manifest product=${JSON.stringify(manifest.product)}`);
          if (manifest.version !== '1.2.0') failures.push(`manifest version=${JSON.stringify(manifest.version)}`);
          if (manifest.releaseReady !== false) failures.push(`manifest releaseReady=${JSON.stringify(manifest.releaseReady)} (must remain false)`);
          if (failures.length) {
            console.error('V1.2 provenance BLOCKED: unsafe/stale candidate identity:');
            for (const failure of failures) console.error(` - ${failure}`);
            process.exit(1);
          }
          console.error('V1.2 source identity markers PASS.');
          NODE

          expected_lock_sha='1eb32525cf5c4db2e976e44d348724054fe3c789a7ee535b943af16480e3674c'
          actual_lock_sha="$(sha256sum package-lock.json | awk '{print $1}')"
          if [[ "$actual_lock_sha" != "$expected_lock_sha" ]]; then
            printf 'V1.2 provenance BLOCKED: package-lock.json mismatch.\n expected: %s\n actual:   %s\n' "$expected_lock_sha" "$actual_lock_sha" >&2
            printf 'Never bless a dependency refresh implicitly.\n' >&2
            exit 1
          fi

          printf '\nSource identity is plausible, but certification is still BLOCKED.\n' >&2
          printf 'Required next: exact certified V1.1.1 base provenance; schema-v3 whole-tree regression audit;\n' >&2
          printf 'whole-tree-bound critical-change review; complete Node 26.7.0/npm 12.0.2 functional/static/mutation,\n' >&2
          printf 'nine-format, Worker/integration/browser/platform, Windows, fresh-ZIP and staging acceptance gates.\n' >&2
          exit 1
