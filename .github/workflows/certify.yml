name: Cosmic Transcriber Web 1.2.0 Certification Guard

on:
  push:
    branches: ['dev/v1.2.0-ci-source-20260821', 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# IMPORTANT:
# This branch currently contains only the CI/documentation shell, not the
# complete CosmicTranscriberWeb-1.2.0-dev application source. Until the exact
# V1.2 source is synchronized, CI must fail closed rather than emit evidence
# that could be mistaken for release certification.
#
# This guard is deliberately NOT a certification workflow. Even when an exact
# source tree is synchronized and the provenance checks below pass, this job
# exits non-zero until the reviewed V1.2 certification matrix is restored.

jobs:
  source-provenance-guard:
    name: V1.2 exact-source provenance required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Validate source identity, then refuse certification
        shell: bash
        run: |
          set -euo pipefail

          required=(
            package.json
            package-lock.json
            app.js
            wrangler.toml
            RELEASE_MANIFEST.json
            scripts/validate.mjs
            tests
          )

          missing=()
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              missing+=("$path")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'V1.2 certification BLOCKED: exact application source is not synchronized to this branch.\n' >&2
            printf 'Missing required source markers:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            printf '\nDo not interpret any CI result from this shell branch as V1.2 certification.\n' >&2
            printf 'Production V1.1.1 must remain untouched. releaseReady must remain false.\n' >&2
            exit 1
          fi

          # Presence alone is insufficient: a stale 1.0.x/1.1.x tree could
          # otherwise satisfy the marker list. Use Node's built-in JSON parser
          # so this check has no npm/dependency prerequisite.
          node <<'NODE'
          const fs = require('node:fs');

          function readJson(path) {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (error) {
              console.error(`V1.2 provenance BLOCKED: ${path} is not valid JSON: ${error.message}`);
              process.exit(1);
            }
          }

          const pkg = readJson('package.json');
          const manifest = readJson('RELEASE_MANIFEST.json');
          const failures = [];

          if (pkg.version !== '1.2.0') {
            failures.push(`package.json version must be 1.2.0; found ${JSON.stringify(pkg.version)}`);
          }
          if (manifest.product !== 'Cosmic Transcriber Web') {
            failures.push(`RELEASE_MANIFEST.json product mismatch: ${JSON.stringify(manifest.product)}`);
          }
          if (manifest.version !== '1.2.0') {
            failures.push(`RELEASE_MANIFEST.json version must be 1.2.0; found ${JSON.stringify(manifest.version)}`);
          }
          if (manifest.releaseReady !== false) {
            failures.push(`development candidate must have releaseReady:false; found ${JSON.stringify(manifest.releaseReady)}`);
          }

          if (failures.length) {
            console.error('V1.2 provenance BLOCKED: synchronized tree has stale or unsafe identity:');
            for (const failure of failures) console.error(` - ${failure}`);
            process.exit(1);
          }

          console.error('V1.2 source identity markers PASS: package/manifest both identify 1.2.0 and releaseReady:false.');
          NODE

          expected_lock_sha='1eb32525cf5c4db2e976e44d348724054fe3c789a7ee535b943af16480e3674c'
          actual_lock_sha="$(sha256sum package-lock.json | awk '{print $1}')"
          if [[ "$actual_lock_sha" != "$expected_lock_sha" ]]; then
            printf 'V1.2 provenance BLOCKED: package-lock.json does not match the reviewed development candidate.\n' >&2
            printf ' expected: %s\n' "$expected_lock_sha" >&2
            printf ' actual:   %s\n' "$actual_lock_sha" >&2
            printf 'Do not refresh dependencies or bless a new lockfile implicitly; review and record any dependency change first.\n' >&2
            exit 1
          fi
          printf 'V1.2 reviewed package-lock SHA-256: PASS\n' >&2

          printf '\nSource identity is plausible, but this guard intentionally does not certify V1.2.\n' >&2
          printf 'Before this workflow may be replaced, compare the synchronized tree against the exact local\n' >&2
          printf 'V1.2 candidate provenance/checksum inventory and complete the mandatory V1.1.1 -> V1.2\n' >&2
          printf 'adversarial regression audit.\n\n' >&2
          printf 'Then restore the reviewed V1.2 certification matrix, including Node 26.7.0/npm 12.0.2,\n' >&2
          printf 'nine-format fixtures, Worker/integration/browser matrices, Windows release certification,\n' >&2
          printf 'fresh-ZIP revalidation and all-green aggregation.\n' >&2
          exit 1
