name: Cosmic Transcriber cancellation diagnostics

on:
  push:
    branches: ['diag/cancel-1.0.12']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-source:
    name: Export exact cancellation source
    if: ${{ !contains(github.event.head_commit.message, '[diag-export]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: diag/cancel-1.0.12
      - name: Materialize exact reviewed source snapshot
        run: python .ci/materialize.py
      - name: Repair and verify integration harness
        run: python .ci/repair_integration.py
      - name: Repair Playwright E2E endpoint inheritance
        run: python .ci/repair_e2e.py
      - name: Refresh reviewed install policy and Safari repair
        run: python .ci/repair_install_policy.py
      - name: Export exact cancellation-related source to diagnostic branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf diagnostic-export
          mkdir -p diagnostic-export/public-js diagnostic-export/tests
          cp work/tests/e2e/app.spec.js diagnostic-export/tests/app.spec.js
          cp work/public/js/*.js diagnostic-export/public-js/
          cp work/playwright.config.js diagnostic-export/playwright.config.js
          cp work/package.json diagnostic-export/package.json
          git config user.name 'cosmic-ci-diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostic-export
          git commit -m '[diag-export] Export exact cancellation source'
          git push origin HEAD:diag/cancel-1.0.12
