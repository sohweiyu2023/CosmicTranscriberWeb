name: Reconstruct and preserve V1.2 development source

on:
  push:
    branches: ['dev/v1.2.0-ci-source-20260821']
    paths:
      - '.github/workflows/reconstruct-v12-dev-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cosmic-v12-reconstruct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct-v12:
    name: Reconstruct V1.2 dev source + focused runtime gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.7.0'
          package-manager-cache: false

      - name: Pin exact npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Verify exact Node/npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v26.7.0"
          test "$(npm --version)" = "12.0.2"

      - name: Recover exact certified V1.1.1 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v111-wrapper" "$RUNNER_TEMP/v12-work"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            '/repos/${{ github.repository }}/actions/artifacts/9277847563/zip' \
            > "$RUNNER_TEMP/v111-wrapper/artifact.zip"
          printf '%s  %s\n' \
            '8347bb5e4bc7bf1904a0aaa26a285b07de4166e8b41be227f7af13dfc0a1fa2c' \
            "$RUNNER_TEMP/v111-wrapper/artifact.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/v111-wrapper/artifact.zip" -d "$RUNNER_TEMP/v111-wrapper/extracted"
          test -f "$RUNNER_TEMP/v111-wrapper/extracted/CosmicTranscriberWeb-1.1.1-source.zip"
          printf '%s  %s\n' \
            'a241dbf4ae50dab0e83b4a65000e587a7ffb51b0b568e9017207e22be81a27df' \
            "$RUNNER_TEMP/v111-wrapper/extracted/CosmicTranscriberWeb-1.1.1-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/v111-wrapper/extracted/CosmicTranscriberWeb-1.1.1-source.zip" -d "$RUNNER_TEMP/v12-work"
          node tools/v12-verify-certified-base.mjs \
            --base "$RUNNER_TEMP/v12-work/CosmicTranscriberWeb-1.1.1" \
            --certified-zip "$RUNNER_TEMP/v111-wrapper/extracted/CosmicTranscriberWeb-1.1.1-source.zip"
          mv "$RUNNER_TEMP/v12-work/CosmicTranscriberWeb-1.1.1" "$RUNNER_TEMP/v12-work/CosmicTranscriberWeb-1.2.0-dev"

      - name: Materialize reviewed V1.2 reconstruction Batch 1
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v12-reconstruct.gz.b64" <<'V12_RECONSTRUCTION_B64'
          
          V12_RECONSTRUCTION_B64
          base64 -d "$RUNNER_TEMP/v12-reconstruct.gz.b64" | gzip -dc > "$RUNNER_TEMP/v12-reconstruct.mjs"
          node --check "$RUNNER_TEMP/v12-reconstruct.mjs"
          node "$RUNNER_TEMP/v12-reconstruct.mjs" --root "$RUNNER_TEMP/v12-work/CosmicTranscriberWeb-1.2.0-dev"
          test "$(node -p "require('$RUNNER_TEMP/v12-work/CosmicTranscriberWeb-1.2.0-dev/package.json').version")" = '1.2.0'
          test "$(node -p "require('$RUNNER_TEMP/v12-work/CosmicTranscriberWeb-1.2.0-dev/RELEASE_MANIFEST.json').releaseReady")" = 'false'
          printf '%s  %s\n' \
            '1eb32525cf5c4db2e976e44d348724054fe3c789a7ee535b943af16480e3674c' \
            "$RUNNER_TEMP/v12-work/CosmicTranscriberWeb-1.2.0-dev/package-lock.json" | sha256sum -c -

      - name: Install exact reviewed dependency graph
        working-directory: ${{ runner.temp }}/v12-work/CosmicTranscriberWeb-1.2.0-dev
        run: npm ci

      - name: Verify dependency install-script policy and audit
        working-directory: ${{ runner.temp }}/v12-work/CosmicTranscriberWeb-1.2.0-dev
        run: npm run deps:install-scripts:verify && npm audit

      - name: Run dependency-free functional/static/mutation validation
        working-directory: ${{ runner.temp }}/v12-work/CosmicTranscriberWeb-1.2.0-dev
        run: npm run validate

      - name: Run Worker Vitest
        working-directory: ${{ runner.temp }}/v12-work/CosmicTranscriberWeb-1.2.0-dev
        run: npm run test:worker

      - name: Run whole-Worker integration
        working-directory: ${{ runner.temp }}/v12-work/CosmicTranscriberWeb-1.2.0-dev
        run: npm run test:integration

      - name: Build inspection
        working-directory: ${{ runner.temp }}/v12-work/CosmicTranscriberWeb-1.2.0-dev
        run: npm run build:inspect

      - name: Strip generated/dependency state before preservation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v12-work/CosmicTranscriberWeb-1.2.0-dev"
          rm -rf "$ROOT/node_modules" "$ROOT/dist" "$ROOT/coverage" "$ROOT/.wrangler" "$ROOT/evidence" "$ROOT/test-results" "$ROOT/playwright-report" "$ROOT/blob-report"
          test "$(node -p "require('$ROOT/RELEASE_MANIFEST.json').releaseReady")" = 'false'
          printf '%s  %s\n' \
            '1eb32525cf5c4db2e976e44d348724054fe3c789a7ee535b943af16480e3674c' \
            "$ROOT/package-lock.json" | sha256sum -c -

      - name: Preserve reconstructed development source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CosmicTranscriberWeb-1.2.0-dev-reconstructed-batch1
          path: ${{ runner.temp }}/v12-work/CosmicTranscriberWeb-1.2.0-dev
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Record development-only boundary
        shell: bash
        run: |
          {
            echo '## V1.2 reconstructed development source preserved'
            echo
            echo '- Exact certified V1.1.1 base verified: **yes**'
            echo '- Reviewed V1.2 lock SHA-256 reproduced: **yes**'
            echo '- releaseReady: **false**'
            echo '- V1.2 release certified: **no**'
            echo '- Production V1.1.1 changed: **no**'
            echo '- Browser/Windows/macOS/staging release matrix complete: **no**'
          } >> "$GITHUB_STEP_SUMMARY"
