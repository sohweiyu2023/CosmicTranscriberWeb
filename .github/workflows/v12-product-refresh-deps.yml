name: V1.2 Product Refresh Direct Dependencies

on:
  pull_request:
    branches:
      - dev/v1.2.0-validation-base
    paths:
      - '.github/workflows/v12-product-refresh-deps.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    name: Refresh V1.2 direct dependencies to registry latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 26.7.0
      - name: Install exact npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Reconstruct current V1.2 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v26.7.0
          test "$(npm --version)" = 12.0.2
          ROOT="$RUNNER_TEMP/v12-refresh"
          mkdir -p "$ROOT"
          gh api '/repos/${{ github.repository }}/actions/artifacts/9277847563/zip' > "$ROOT/wrapper.zip"
          printf '%s  %s\n' '8347bb5e4bc7bf1904a0aaa26a285b07de4166e8b41be227f7af13dfc0a1fa2c' "$ROOT/wrapper.zip" | sha256sum -c -
          unzip -q "$ROOT/wrapper.zip" -d "$ROOT/wrapper"
          CERT="$ROOT/wrapper/CosmicTranscriberWeb-1.1.1-source.zip"
          printf '%s  %s\n' 'a241dbf4ae50dab0e83b4a65000e587a7ffb51b0b568e9017207e22be81a27df' "$CERT" | sha256sum -c -
          unzip -q "$CERT" -d "$ROOT/source"
          CANDIDATE="$ROOT/source/CosmicTranscriberWeb-1.1.1"
          cat product/v12-fast.patch.gz.b64/part-* > "$ROOT/v12.b64"
          printf '%s  %s\n' 'ae9b5427d660bf4f6180ca816410e6d3dadaf63ec5bc26e73be6564a7e1381ee' "$ROOT/v12.b64" | sha256sum -c -
          base64 -d "$ROOT/v12.b64" > "$ROOT/v12.patch.gz"
          gzip -dc "$ROOT/v12.patch.gz" > "$ROOT/v12.patch"
          printf '%s  %s\n' 'b4647de860f7f387c89754f9aeb9bf7dac2e3468ca222053cdba45d5e24d934b' "$ROOT/v12.patch" | sha256sum -c -
          cd "$CANDIDATE"
          chmod -R u+rwX .
          git init -q
          git config user.name 'Cosmic V1.2 CI'
          git config user.email 'ci@example.invalid'
          git apply --check "$ROOT/v12.patch"
          git apply "$ROOT/v12.patch"
          test "$(node -p "require('./package.json').version")" = 1.2.0
          git add package.json package-lock.json
          git commit -qm 'pre dependency refresh'
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Refresh direct dependencies to registry latest
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          node scripts/deps-latest.mjs
          echo '--- direct dependency status after refresh ---'
          npm outdated --depth=0 || true
          node -e "const p=require('./package.json'); console.log(JSON.stringify({dependencies:p.dependencies,devDependencies:p.devDependencies,allowScripts:p.allowScripts},null,2))"
      - name: Create exact dependency overlay and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          git diff --binary HEAD -- package.json package-lock.json > "$ROOT/v12-deps-latest.patch"
          test -s "$ROOT/v12-deps-latest.patch"
          gzip -n -9 -c "$ROOT/v12-deps-latest.patch" > "$ROOT/v12-deps-latest.patch.gz"
          base64 -w0 "$ROOT/v12-deps-latest.patch.gz" > "$ROOT/v12-deps-latest.patch.gz.b64"
          sha256sum "$ROOT/v12-deps-latest.patch" "$ROOT/v12-deps-latest.patch.gz" "$ROOT/v12-deps-latest.patch.gz.b64" package.json package-lock.json | tee "$ROOT/SHA256SUMS.txt"
          cp package.json package-lock.json "$ROOT/"
          node scripts/install-script-policy.mjs > "$ROOT/install-script-policy.txt" 2>&1 || true
          cat "$ROOT/install-script-policy.txt"
      - name: Upload refreshed dependency overlay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v12-refreshed-dependency-overlay
          path: |
            ${{ env.ROOT }}/v12-deps-latest.patch
            ${{ env.ROOT }}/v12-deps-latest.patch.gz
            ${{ env.ROOT }}/v12-deps-latest.patch.gz.b64
            ${{ env.ROOT }}/package.json
            ${{ env.ROOT }}/package-lock.json
            ${{ env.ROOT }}/SHA256SUMS.txt
            ${{ env.ROOT }}/install-script-policy.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce install-script policy after refresh
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE"
          npm run deps:install-scripts:verify
          npm audit
          npm outdated --depth=0
